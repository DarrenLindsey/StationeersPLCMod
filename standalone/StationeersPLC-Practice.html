$('lvars').addEventListener('change',function(ev){var t=ev.target,i=t.getAttribute('data-i'),f=t.getAttribute('data-f');if(i==null)return;var v=LD.vars[parseInt(i,10)];
  if(f==='name'){var nv=t.value.trim();if(!validName(nv)||LD.vars.some(function(x){return x!==v&&x.name===nv})){t.value=v.name;return}renameRefs(v.name,nv);v.name=nv}
  else if(f==='type'){v.type=t.value;if(v.type==='TON')v.at=''}
  else if(f==='at'){v.at=t.value.trim().toUpperCase();if(/^%[IQ]X/.test(v.at))v.type='BOOL';else if(/^%[IQ]W/.test(v.at))v.type='INT'}
  changed();
});

/* ---- ST generation ---- */
function andJ(a,b){if(a==='TRUE')return b;if(b==='TRUE')return a;return a+' AND '+b}
function orJ(l){if(l.indexOf('TRUE')>=0)return 'TRUE';if(l.length===1)return l[0];return '('+l.join(' OR ')+')'}
function genST(){
  var errs=[],decl=[],body=[],timers={},fbUsed={};
  LD.vars.forEach(function(v){if(!validName(v.name))errs.push('Variable name "'+v.name+'" is not valid (letters, digits, underscore; not starting with a digit).');decl.push('    '+v.name+(v.at?' AT '+v.at:'')+' : '+v.type+';')});
  function ser(a,left,st,ri){var e=left;
    a.forEach(function(el){
      if(el.k==='par'){e=orJ(el.branches.map(function(b){return ser(b,e,st,ri)}))}
      else if(el.k==='ton'){if(!el.v){errs.push('Rung '+(ri+1)+': choose a timer.');return}if(timers[el.v])errs.push('Rung '+(ri+1)+': timer '+el.v+' is used more than once.');timers[el.v]=1;st.push(el.v+'(IN := '+e+', PT := '+(el.pt||'T#1s')+');');e=el.v+'.Q'}
      else if(el.k==='fb'){
        var B=FB[el.t];if(!B||!el.v){errs.push('Rung '+(ri+1)+': choose a block.');return}
        if(fbUsed[el.v])errs.push('Rung '+(ri+1)+': block '+el.v+' is used more than once. Each block needs its own copy.');fbUsed[el.v]=1;
        var args=[];if(B.pin)args.push(B.pin+' := '+e);
        B.ins.forEach(function(i){if(i.n===B.pin)return;var val=((el.a&&el.a[i.n])||'').trim();
          if(val===''){if(i.req)errs.push('Rung '+(ri+1)+': '+el.t+' needs a value for '+i.n+'.');return}
          args.push(i.n+' := '+val)});
        st.push(el.v+'('+args.join(', ')+');');
        B.outs.forEach(function(o){var tv=el.o&&el.o[o.n];if(tv)st.push(tv+' := '+el.v+'.'+o.n+';')});
        if(B.out){var q=el.v+'.'+B.out;e=B.pin?q:andJ(e,q)}
      }
      else if(el.k==='cmp'){if(!el.a||el.b===''||el.b==null)errs.push('Rung '+(ri+1)+': finish the compare block.');e=andJ(e,'('+el.a+' '+el.op+' '+el.b+')')}
      else{if(!el.v)errs.push('Rung '+(ri+1)+': choose a variable for a contact.');e=andJ(e,(el.k==='nc'?'NOT ':'')+el.v)}
    });return e}
  LD.rungs.forEach(function(r,ri){
    var rn='Rung'+(ri+1),st=[];decl.push('    '+rn+' : BOOL;');
    var ex=ser(r.net,'TRUE',st,ri);
    body.push('// Rung '+(ri+1)+(r.comment?': '+r.comment.replace(/[\r\n]+/g,' '):''));
    st.forEach(function(s){body.push(s)});body.push(rn+' := '+ex+';');
    r.coils.forEach(function(c){
      if(!c.v){errs.push('Rung '+(ri+1)+': choose a variable for the coil.');return}
      if(c.k==='coil')body.push(c.v+' := '+rn+';');
      else if(c.k==='ncoil')body.push(c.v+' := NOT '+rn+';');
      else body.push('IF '+rn+' THEN '+c.v+' := '+(c.k==='set'?'TRUE':'FALSE')+'; END_IF;');
    });body.push('');
  });
  var st='(* Generated from the ladder diagram. Edit the ladder, not this text. *)\nPROGRAM Main\nVAR\n'+decl.join('\n')+'\nEND_VAR\n\n'+body.join('\n')+'\nEND_PROGRAM\n';
  return {st:st,errs:errs};
}
function updateGen(){if(genOpen)$('gen').textContent=genSafe().st}
function genSafe(){try{return genST()}catch(e){return {st:'',errs:[String(e)]}}}

var chkT=0;
function scheduleCheck(){updateGen();if(tab!=='ladder')return;clearTimeout(chkT);chkT=setTimeout(ladderCheck,350)}
function ladderCheck(){
  var g=genSafe();errLine=0;
  if(g.errs.length){msg.className='msg warn';msg.textContent='To finish: '+g.errs[0]+(g.errs.length>1?'  (+'+(g.errs.length-1)+' more)':'');return}
  post('/api/check',g.st).then(function(r){return r.json()}).then(function(c){
    if(!c.ok){msg.className='msg err';msg.textContent='Problem: '+c.error}
    else if(c.warning){msg.className='msg warn';msg.textContent='Warning: '+c.warning}
    else{msg.className='msg okm';msg.textContent='Ladder looks good. Press Compile, then Run.'}
  }).catch(function(){});
}
function pushLadder(){
  var g=genSafe();
  if(g.errs.length){msg.className='msg warn';msg.textContent='To finish: '+g.errs[0];return false}
  ed.value=g.st;lines();post('/api/program',g.st);dirty=false;return true;
}

window.useIO=function(p){

  var base=(p.tag+'_'+p.sig).replace(/[^A-Za-z0-9_]/g,'_').replace(/^(\d)/,'_$1');

    var ex=LD.vars.filter(function(v){return v.at===pre})[0];
    if(ex){msg.className='msg okm';msg.textContent=ex.name+' already uses '+pre+'.';return}
    var name=uniqueName(base);LD.vars.push({name:name,type:isb?'BOOL':'INT',at:pre});changed();
    msg.className='msg okm';msg.textContent='Added variable '+name+' at '+pre+'. Use it in a contact or coil.';
  }else{
    var line='    '+base+' AT '+pre+' : '+(isb?'BOOL':'INT')+';\n',t=ed.value,k=t.indexOf('END_VAR');
    if(k>=0){ed.value=t.substring(0,k)+line+t.substring(k)}else{var s=ed.selectionStart;ed.value=t.substring(0,s)+line+t.substring(s)}
    onEdit(true);msg.className='msg okm';msg.textContent='Added '+base+' to your VAR section.';
  }

var STARTERS={
 blink:function(){return {vars:[V('Tick','TON'),V('Light','BOOL')],rungs:[

 seal:function(){return {vars:[V('Start','BOOL'),V('Stop','BOOL'),V('Motor','BOOL')],rungs:[

 airlockblock:function(){return {vars:[V('Pressure','INT'),V('GoIn','BOOL'),V('GoOut','BOOL'),V('DoorIn','BOOL'),V('DoorOut','BOOL'),V('LockIn','BOOL'),V('LockOut','BOOL'),V('FillPump','BOOL'),V('EvacPump','BOOL'),V('Cycle','AIRLOCK')],rungs:[
  {comment:'One AIRLOCK block does the whole cycle. Connect the variables to your devices.',net:[{k:'fb',t:'AIRLOCK',v:'Cycle',a:{GO_IN:'GoIn',GO_OUT:'GoOut',PRESSURE:'Pressure',TARGET_IN:'100.0',TARGET_OUT:'0.0',TOL:'2.0',TIMEOUT:'T#60s'},o:{OPEN_IN:'DoorIn',OPEN_OUT:'DoorOut',LOCK_IN:'LockIn',LOCK_OUT:'LockOut',FILL:'FillPump',EVAC:'EvacPump'}}],coils:[]}]}},

function loadStarter(name){
  if(LD.vars.length||LD.rungs.some(function(r){return r.net.length||r.coils.length})){if(!confirm('Replace the current ladder with this starter? (Undo can bring it back.)'))return false}

var LESSONS=[
 {t:'1. Blink a light',goal:'Outputs and timers',learn:'A PLC runs your program over and over, a few times a second. Each pass is called a scan. A timer counts across scans, so things can happen over time instead of instantly.',
  steps:['Press Load starter.','Under Variables, give the Light row an address: find your light in Devices &amp; I/O and press + use (a new variable appears), or type its %QX number into the Light row.','Press Compile, then Run. Watch the wires change colour as the timer counts.'],
  chal:'Make the light blink twice as fast. Hint: change the timer delay.',starter:'blink'},
 {t:'2. A button controls a light',goal:'Inputs',learn:'An input is a signal coming from the world into your program. A contact passes power when its variable is ON. A coil sets its variable to match the power that reaches it.',
  steps:['In the game, place a button and a light and name them (for example PLC-Button and PLC-Light).','Press Load starter, then use + use on the button&#39;s Activate or Setting signal (an input, shown as %IX) and set Button to that address.','Set Light to your light&#39;s On switch (a %QX address). Compile and Run, then press the button in the game.'],
  chal:'Make the light turn OFF when the button is pressed. Hint: use a normally closed contact.',starter:'button'},
 {t:'3. Start / Stop motor (seal-in)',goal:'Latching with feedback',learn:'The Motor contact in parallel with Start keeps power flowing after Start is released. That is called a seal-in or holding circuit. The Stop contact is normally closed, so pressing Stop breaks the path.',
  steps:['Press Load starter and connect Start, Stop and Motor to real signals, or test with the Force buttons in the Program variables table.','Compile and Run. Force Start to 1, then back to 0: the Motor stays on.','Force Stop to 1 and the Motor drops out.'],
  chal:'Add a second Stop button in series so either one stops the motor.',starter:'seal'},
 {t:'4. Pump with high and low limits',goal:'Numbers and hysteresis',learn:'Real plants avoid switching on and off at a single value. Two limits create a gap (hysteresis). A Set coil latches on and a Reset coil latches off, so the pump holds its state between the limits.',
  steps:['Press Load starter. Find a gas sensor Pressure reading in Devices &amp; I/O and give Pressure that %IW address.','Look at the live value and change the 800 and 600 limits to suit your tank.','Connect Pump to a pump or valve On switch. Compile and Run.'],
  chal:'Add a rung that forces the pump off if a Stop variable is ON, whatever the pressure.',starter:'level'},
 {t:'5. Sequence with a delay',goal:'Ordering actions',learn:'Industrial processes start things in order. A timer on the second step waits for the first step to be true, then adds a delay.',
  steps:['Press Load starter and connect Valve and Pump to real devices; use Force on Start to try it.','Compile and Run, then force Start to 1: the valve opens now, the pump follows after 5 seconds.','Force Start to 0 to see both stop.'],
  chal:'Make the pump stop 3 seconds after the valve closes (needs an off-delay: build it with a second timer).',starter:'sequence'},
 {t:'6. Function blocks in ladder',goal:'Using blocks from the + menu',learn:'Click any + on a rung and choose Function block to drop in HYST, PID, AIRLOCK and more. A block with a power pin takes the rung power into that pin. Others run every scan and you set their inputs in the panel below the ladder. Send block outputs to your own variables with the arrows, or use them in contacts as Name.Output.',
  steps:['Press Load starter. It builds a tank pump with a HYST block: IN is Level, LOW and HIGH are 100 and 300.','Give Level a gas sensor or tank address and Pump a pump On switch, then Compile and Run.','Click the HYST box to see its inputs. Try the AIRLOCK starter from the examples list too.'],
  chal:'Add a BLINK block on a second rung with Fill.Q as its power so a warning lamp flashes while the pump runs.',starter:'tankblock'},
 {t:'7. Function blocks: a tank pump (ST)',goal:'Reusing logic with HYST',learn:'A function block is a ready-made piece of logic with its own memory. You declare one like a variable, call it every scan with its inputs, then read its outputs as Name.Output. HYST holds a pump on until the tank is full, so you no longer build the limits by hand.',
  steps:['Press Load into ST editor. Find a gas sensor or tank Pressure reading and a pump On switch in Devices &amp; I/O, and put their addresses on the Level and Pump lines.','Compile and Run. Watch Fill.Q in the Program variables table: it turns on below 100 and off above 300.','Change INVERT to TRUE: now it is a cooler or vent that runs when the value is HIGH.'],
  chal:'Add a BLINK block that flashes a warning light whenever the pump has been on for more than 30 seconds (use a TON and BLINK together).',
  st:'PROGRAM Main\nVAR\n    Level AT %IW0 : INT;      // replace with your sensor address\n    Pump  AT %QX0 : BOOL;     // replace with your pump address\n    Fill  : HYST;\nEND_VAR\n\nFill(IN := Level, LOW := 100.0, HIGH := 300.0);\nPump := Fill.Q;\nEND_PROGRAM\n'},
 {t:'8. An airlock with one block',goal:'A state machine with safety',learn:'The AIRLOCK block runs the whole cycle: it shuts and locks both doors, pumps the chamber to the target pressure, then opens only the destination door. If the pressure does not arrive before the timeout it stops, with FAULT on and both doors locked. Players build this by hand in IC10; here you wire its inputs and outputs and the block does the sequencing.',
  steps:['Press Load into ST editor. Put your airlock sensor, door and pump addresses on the lines at the top (the in-game airlock devices show in Devices &amp; I/O).','Compile and Run. Pulse GoIn or GoOut with Force: the doors lock, FILL or EVAC runs, then one door opens.','Watch Lock.STATE and Lock.FAULT. To test the safety timeout, stop the pump and wait 60 seconds.'],
  chal:'Add a BLINK block so a beacon flashes while Lock.BUSY is on, and a second one that flashes quickly on FAULT.',
  st:'PROGRAM Main\nVAR\n    Pressure AT %IW0 : INT;       // chamber pressure sensor (kPa)\n    GoIn     AT %IX0 : BOOL;      // button inside-bound\n    GoOut    AT %IX1 : BOOL;      // button outside-bound\n    DoorIn   AT %QX0 : BOOL;      // 1 = open\n    DoorOut  AT %QX1 : BOOL;\n    LockIn   AT %QX2 : BOOL;\n    LockOut  AT %QX3 : BOOL;\n    FillPump AT %QX4 : BOOL;      // adds gas from the station\n    EvacPump AT %QX5 : BOOL;      // removes gas from the chamber\n    Lock     : AIRLOCK;\nEND_VAR\n\nLock(GO_IN := GoIn, GO_OUT := GoOut, PRESSURE := Pressure, TARGET_IN := 100.0, TARGET_OUT := 0.0);\nDoorIn := Lock.OPEN_IN;\nDoorOut := Lock.OPEN_OUT;\nLockIn := Lock.LOCK_IN;\nLockOut := Lock.LOCK_OUT;\nFillPump := Lock.FILL;\nEvacPump := Lock.EVAC;\nEND_PROGRAM\n'},
 {t:'9. Write your own function block',goal:'FUNCTION_BLOCK',learn:'You can make your own blocks. Write FUNCTION_BLOCK before PROGRAM, list what goes in (VAR_INPUT) and what comes out (VAR_OUTPUT), keep private memory in VAR, then write the logic. Each time you declare an instance it gets its own copy of the memory, so two pumps can each use the same block independently.',
  steps:['Press Load into ST editor and read the Pulse block: it turns an output on for a set time after a button press.','Compile and Run. Force Btn to 1 then 0 and watch Short.Out and Long.Out run for different times.','Press Check often while editing. Errors inside a block are reported even if nothing calls it yet.'],
  chal:'Write a block called Debounce that only turns Out on after In has been on for 200 ms, and use it on the button.',
  st:'FUNCTION_BLOCK Pulse\nVAR_INPUT\n    Go  : BOOL;\n    Len : TIME := T#1s;\nEND_VAR\nVAR_OUTPUT\n    Out : BOOL;\nEND_VAR\nVAR\n    Edge  : R_TRIG;\n    Timer : TON;\nEND_VAR\nEdge(CLK := Go);\nIF Edge.Q THEN\n    Out := TRUE;\nEND_IF;\nTimer(IN := Out, PT := Len);\nIF Timer.Q THEN\n    Out := FALSE;\nEND_IF;\nEND_FUNCTION_BLOCK\n\nPROGRAM Main\nVAR\n    Btn   : BOOL;\n    Short : Pulse;\n    Long  : Pulse;\nEND_VAR\n\nShort(Go := Btn, Len := T#300ms);\nLong(Go := Btn, Len := T#3s);\nEND_PROGRAM\n'}
];
function renderLessons(){

$('lessons').addEventListener('click',function(e){var b=e.target.closest('button[data-l]');if(!b)return;var l=LESSONS[parseInt(b.getAttribute('data-l'),10)];
  if(l.st){if(ed.value.trim()&&ed.value.trim()!==l.st.trim()&&!confirm('Replace the program in the ST editor with this example?'))return;ed.value=l.st;lines();post('/api/program',l.st);dirty=false;setTab('st');return}

resetLD();

<script>/* Practice tab: scene drawing and controls for the simulated scenarios. Needs shim.js (window.Bench). */
(function () {
  'use strict';
  var B = window.Bench, root = document.getElementById('practice');
  if (!B || !root) return;
  var FAULTS = { tank: [['leak', 'Leak in the tank (extra drain)'], ['pumpFail', 'Pump failure (motor will not turn)']],

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function build() {

         '<span class="hint">Simulated devices. No game needed. Use the I/O list on the right to find addresses.</span></div>';

    h += '<div class="pb-ctl">';
    (BUTTONS[sc.id] || []).forEach(function (b) { h += '<button class="pb-hold" data-ui="' + b[0] + '">' + esc(b[1]) + '</button>'; });
    if (sc.id === 'tank') h += '<label>Demand <input id="pbDemand" type="range" min="0" max="12" step="0.5" value="' + w.ui.demand + '"> <span id="pbDv">' + w.ui.demand + ' kPa/s</span></label>';
    (FAULTS[sc.id] || []).forEach(function (f) { h += '<label class="pb-f"><input type="checkbox" data-f="' + f[0] + '"' + (w.faults[f[0]] ? ' checked' : '') + '> ' + esc(f[1]) + '</label>'; });
    h += '</div><h3>Goals</h3><ul id="pbGoals"></ul><details><summary>Hint</summary><p>' + esc(sc.hint) + '</p></details><h3>Events</h3><div id="pbLog" class="pb-log"></div>';
    root.innerHTML = h;
    svg = document.getElementById('pbSvg'); goalsEl = document.getElementById('pbGoals'); logEl = document.getElementById('pbLog');
    document.getElementById('pbSel').onchange = function () { stopPlc(); B.load(this.value); };
    document.getElementById('pbReset').onclick = function () { stopPlc(); B.load(B.scenario); };
    Array.prototype.forEach.call(root.querySelectorAll('.pb-hold'), function (b) {
      var k = b.getAttribute('data-ui');
      function on(e) { e.preventDefault(); B.world.ui[k] = true; b.classList.add('down'); }
      function off() { B.world.ui[k] = false; b.classList.remove('down'); }
      b.addEventListener('mousedown', on); b.addEventListener('touchstart', on);
      b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off); b.addEventListener('touchend', off);
    });
    var dm = document.getElementById('pbDemand');
    if (dm) dm.oninput = function () { B.world.ui.demand = parseFloat(this.value); document.getElementById('pbDv').textContent = this.value + ' kPa/s'; };
    Array.prototype.forEach.call(root.querySelectorAll('input[data-f]'), function (c) { c.onchange = function () { B.world.faults[c.getAttribute('data-f')] = c.checked; }; });
  }
  function stopPlc() { if (B.plc) B.plc.running = false; }

  function bulb(cx, cy, g, label) {
    var c = Math.round(60 + 195 * g);
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (34 + 12 * g) + '" fill="rgba(255,220,80,' + (0.25 * g).toFixed(2) + ')"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="26" fill="rgb(' + c + ',' + c + ',' + Math.round(40 + 40 * g) + ')" stroke="#8394a8" stroke-width="3"/>' +
      '<rect x="' + (cx - 14) + '" y="' + (cy + 24) + '" width="28" height="14" fill="#5b6b80"/><text x="' + cx + '" y="' + (cy + 58) + '" text-anchor="middle" fill="#8394a8" font-size="13">' + label + '</text>';
  }
  function rotor(cx, cy, spin, label) {
    var s = '<circle cx="' + cx + '" cy="' + cy + '" r="22" fill="#223044" stroke="#60a5fa" stroke-width="2"/>';
    for (var i = 0; i < 3; i++) { var a = spin + i * 2.094; s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + 19 * Math.cos(a)).toFixed(1) + '" y2="' + (cy + 19 * Math.sin(a)).toFixed(1) + '" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>'; }
    return s + '<text x="' + cx + '" y="' + (cy + 40) + '" text-anchor="middle" fill="#8394a8" font-size="12">' + label + '</text>';
  }
  var DRAW = {
    lightbutton: function (w) {
      return bulb(190, 100, w.light.state.glow, 'SIM-Light') +
        '<circle cx="450" cy="100" r="34" fill="' + (w.ui.btn ? '#4ade80' : '#223044') + '" stroke="#8394a8" stroke-width="3"/><text x="450" y="160" text-anchor="middle" fill="#8394a8" font-size="13">SIM-Button</text>';
    },
    beacon: function (w) { return bulb(320, 100, w.light.state.glow, 'SIM-Beacon'); },
    tank: function (w) {
      var p = w.tank.p, lvl = Math.max(0, Math.min(1, p / 450)), y0 = 30, hh = 170;
      var s = '<rect x="330" y="' + y0 + '" width="120" height="' + hh + '" rx="14" fill="#10151c" stroke="#8394a8" stroke-width="3"/>' +
        '<rect x="334" y="' + (y0 + hh - hh * lvl + 2).toFixed(1) + '" width="112" height="' + Math.max(0, hh * lvl - 4).toFixed(1) + '" fill="rgba(96,165,250,.55)"/>';
      // safe band 100..300 kPa
      [100, 300].forEach(function (v) { var y = y0 + hh - hh * v / 450; s += '<line x1="322" y1="' + y.toFixed(1) + '" x2="458" y2="' + y.toFixed(1) + '" stroke="#fbbf24" stroke-dasharray="5 4"/><text x="466" y="' + (y + 4).toFixed(1) + '" fill="#fbbf24" font-size="11">' + v + '</text>'; });
      s += '<text x="390" y="' + (y0 + hh + 24) + '" text-anchor="middle" fill="#dbe5f0" font-size="14">' + p.toFixed(0) + ' kPa</text>';
      s += '<line x1="170" y1="120" x2="330" y2="120" stroke="' + (w.pump.state.speed > 0.2 && !w.faults.pumpFail ? '#4ade80' : '#5b6b80') + '" stroke-width="6"/>';
      s += rotor(150, 120, w.pump.state.spin, 'SIM-Pump' + (w.faults.pumpFail ? ' (FAILED)' : ''));
      s += '<text x="540" y="115" fill="#8394a8" font-size="12">drain</text><path d="M452 120 H520 M512 112 L522 120 L512 128" stroke="#f87171" stroke-width="3" fill="none" opacity="' + (0.3 + Math.min(0.7, (w.ui.demand + (w.faults.leak ? 5 : 0)) / 12)).toFixed(2) + '"/>';
      return s;
    },
    airlock: function (w) {
      var P = w.ch.p, a = Math.round(40 + P * 1.4);
      var s = '<rect x="10" y="40" width="130" height="150" fill="#1b2635"/><text x="75" y="120" text-anchor="middle" fill="#8394a8" font-size="13">STATION</text><text x="75" y="138" text-anchor="middle" fill="#8394a8" font-size="11">100 kPa</text>' +
        '<rect x="500" y="40" width="130" height="150" fill="#05080c"/><text x="565" y="120" text-anchor="middle" fill="#8394a8" font-size="13">SPACE</text><text x="565" y="138" text-anchor="middle" fill="#8394a8" font-size="11">0 kPa</text>' +
        '<rect x="170" y="60" width="300" height="110" fill="rgba(96,165,250,' + (P / 140).toFixed(2) + ')" stroke="#60a5fa" stroke-width="2"/>' +
        '<text x="320" y="122" text-anchor="middle" fill="#dbe5f0" font-size="18">' + P.toFixed(0) + ' kPa</text>';
      function door(x, d, label) {
        var open = d.state.pos, h = 110 * (1 - open);
        return '<rect x="' + x + '" y="60" width="14" height="110" fill="#10151c"/><rect x="' + x + '" y="60" width="14" height="' + h.toFixed(1) + '" fill="' + (d.isOpen() ? '#f87171' : '#8394a8') + '"/>' +
          '<text x="' + (x + 7) + '" y="52" text-anchor="middle" fill="#8394a8" font-size="11">' + label + (w.cmd(d.lockCmd) ? ' \u{1F512}' : '') + '</text>';
      }
      s += door(150, w.doorIn, 'IN') + door(466, w.doorOut, 'OUT');
      s += rotor(250, 205, w.fill.state.spin, 'fill') + rotor(390, 205, w.evac.state.spin, 'evac');
      if (w.ch.breach) s += '<text x="320" y="30" text-anchor="middle" fill="#f87171" font-size="16">BREACH: both doors were open</text>';
      return s;
    }
  };

  function frame() {
    if (!svg || root.style.display === 'none') return;
    var w = B.world, d = DRAW[w.id];
    if (d) svg.innerHTML = d(w);
    var h = '';
    w.goals.forEach(function (g) { h += '<li class="' + (g.done ? 'done' : (g.failed ? 'fail' : '')) + '">' + (g.done ? '✔ ' : (g.failed ? '✖ ' : '○ ')) + esc(g.text) + '</li>'; });
    if (goalsEl.innerHTML !== h) goalsEl.innerHTML = h;
    var l = w.log.slice(-8).reverse().map(function (e) { return '<div>' + e.t.toFixed(1) + ' s  ' + esc(e.msg) + '</div>'; }).join('');
    l = l || '<span class="hint">Nothing yet.</span>';
    if (logEl.innerHTML !== l) logEl.innerHTML = l;
  }

  B.onChange(function () { build(); frame(); });
  build();
  setInterval(frame, 80);
})();
</script>
</body></html>
