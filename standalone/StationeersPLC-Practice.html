<!doctype html>
<!--
  Stationeers PLC workstation (embedded in the DLL as "index.html"; see StationeersPlc.csproj).
  Layout: left = Ladder / Text (ST) / Lessons tabs + live variables; right = device I/O list.
  Script block 1: ST editor, autocomplete, live check (/api/check), I/O list, polling (/api/state, /api/points).
  Script block 2: theme (CSS variables, localStorage 'plcTheme'), ladder model + SVG drawing, ST generation, lessons, force controls.
  Rules: everything that comes from the game or the user is put through esc()/esc2() before it goes into innerHTML.
  Never rewrite a <datalist> or a focused input on a timer; it closes dropdowns and resets scroll.
-->
<html><head><meta charset='utf-8'><title>Stationeers PLC Workstation</title>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<style>
:root{--bg:#10151c;--panel:#18202b;--line:#2a3646;--text:#dbe5f0;--dim:#8394a8;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--acc:#60a5fa;--ed:#0c1118;--btn:#223044;--hover:#1d2836;--sel:#2b4263;--menu:#1b2635;--pillbg:#26313f;--off:#5b6b80;--lnum:#4f6075;--onfg:#06210f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:600;flex:1}
.badge{padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px;border:1px solid var(--line)}
.run{color:var(--ok);border-color:var(--ok)}.stop{color:var(--dim)}.fault{color:var(--bad);border-color:var(--bad)}
main{flex:1;display:grid;grid-template-columns:minmax(380px,1.5fr) minmax(340px,1fr);gap:12px;padding:12px;min-height:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
section h2{margin:0;padding:8px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
section h2 span{flex:1}
textarea{flex:1;background:var(--ed);color:var(--text);border:0;padding:10px 12px;font:13px/1.45 Consolas,monospace;resize:none;outline:none;tab-size:4;min-height:140px}
button{background:var(--btn);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}button.go{color:var(--ok)}button.halt{color:var(--bad)}
input[type=text]{background:var(--ed);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;width:180px}
.msg{padding:6px 12px;font-size:13px;min-height:28px;border-top:1px solid var(--line)}
.err{color:var(--bad)}.okm{color:var(--ok)}
.left{display:flex;flex-direction:column;gap:12px;min-height:0}
.left section:first-child{flex:1}
.scroll{overflow:auto;flex:1}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:3px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-weight:500;border-bottom:1px solid var(--line)}
tr:hover td{background:var(--hover)}
td.n{font-family:Consolas,monospace;text-align:right}
.off td{color:var(--dim)}.on td.v{color:var(--ok)}
.tb{font-family:Consolas,monospace;color:var(--acc)}

.edwrap{flex:1;display:flex;min-height:140px;background:var(--ed);overflow:hidden}
#ln{margin:0;padding:10px 8px 10px 10px;color:var(--lnum);text-align:right;font:13px/19px Consolas,monospace;overflow:hidden;border-right:1px solid var(--line);user-select:none;min-width:38px}
#ed{font:13px/19px Consolas,monospace;padding:10px 12px;white-space:pre;overflow:auto}
#mir{position:absolute;visibility:hidden;top:0;left:0;white-space:pre;font:13px/19px Consolas,monospace;padding:10px 12px;pointer-events:none}
#pop{position:fixed;display:none;z-index:9;min-width:260px;max-width:460px;max-height:250px;overflow:auto;background:var(--menu);border:1px solid var(--acc);border-radius:6px;box-shadow:0 6px 24px #000a;font-size:12.5px}
#pop div{padding:3px 10px;display:flex;gap:10px;cursor:pointer;white-space:nowrap}
#pop div.sel{background:var(--sel)}
#pop b{font-family:Consolas,monospace;font-weight:600}
#pop i{color:var(--dim);font-style:normal;overflow:hidden;text-overflow:ellipsis;flex:1}
#pop em{font-style:normal;color:var(--acc);font-size:11px;min-width:34px}
.msg.warn{color:var(--warn)}.msg{cursor:default}.msg.err{cursor:pointer}

header .tbtn{font-size:12px;padding:3px 10px;background:var(--btn);color:var(--text);border:1px solid var(--line);border-radius:6px;font-family:inherit}
.tabs{display:flex;gap:4px;flex:1}
.tab{border-radius:6px 6px 0 0;border-bottom:0;padding:4px 14px;background:transparent;color:var(--dim)}
.tab.on{background:var(--btn);color:var(--text);border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}
.chip{border-radius:99px;padding:2px 11px;font-size:12px;background:transparent;color:var(--dim)}
.chip.on{background:var(--btn);color:var(--text);border-color:var(--acc)}
.chips label{color:var(--dim);font-size:12px;margin-left:auto;display:flex;gap:4px;align-items:center}
#iolist{overflow:auto;flex:1;padding:4px 0}
.grp{border-bottom:1px solid var(--line)}
.gh{display:flex;gap:10px;align-items:baseline;padding:6px 12px;cursor:pointer}
.gh:hover{background:var(--hover)}
.gh .car{color:var(--dim);width:12px}.gh b{font-weight:600}.gh span{color:var(--dim);font-size:12px}.gh .cnt{margin-left:auto}
.row{display:grid;grid-template-columns:minmax(120px,1.4fr) 86px minmax(70px,.8fr) 88px;gap:8px;align-items:center;padding:3px 12px 3px 34px;font-size:13px}
.row:hover{background:var(--hover)}
.row .nm small{color:var(--dim);display:block;font-size:11px}
.row.off{opacity:.45}
.code{font-family:Consolas,monospace;color:var(--acc);font-size:12px}
.pill{display:inline-block;min-width:38px;text-align:center;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:700;background:var(--pillbg);color:var(--dim)}
.pill.on{background:var(--ok);color:var(--onfg)}
.pill.tg{cursor:pointer;border:0;font:inherit;font-size:11.5px;font-weight:700}.pill.tg:hover{outline:2px solid var(--acc)}
.val{font-family:Consolas,monospace}
.use{padding:1px 8px;font-size:12px;opacity:.7;white-space:nowrap}
[data-theme=lcars] .use{letter-spacing:.02em;padding:1px 10px}.row:hover .use{opacity:1}
.empty{padding:18px;color:var(--dim);text-align:center}
.ladder{flex:1;display:none;flex-direction:column;min-height:0;overflow:auto}
.ladder.show{display:flex}
.ltools{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.ltools select{background:var(--ed);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
#lscroll{overflow:auto;min-height:300px;flex:1 0 300px;background:var(--ed)}
.ltools,#props,#lvars,#gen{flex-shrink:0}
#svg{display:block}
#svg .el{cursor:pointer}#svg .pl{cursor:pointer;opacity:.35}#svg .pl:hover{opacity:1}
#svg text{font-family:Consolas,monospace;fill:var(--text);font-size:11.5px}
#props{padding:8px 12px;border-top:1px solid var(--line);font-size:13px;min-height:44px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#props select,#props input,#lvars select,#lvars input{background:var(--ed);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;max-width:170px}
#lvars{padding:6px 12px;border-top:1px solid var(--line)}
#lvars table input{width:130px}
#gen{margin:0;padding:8px 12px;max-height:150px;overflow:auto;border-top:1px solid var(--line);font:12px/1.4 Consolas,monospace;color:var(--dim);background:var(--ed);display:none}
.hint{color:var(--dim);font-size:12px}
.st-only{display:flex;flex:1;min-height:0;flex-direction:column}

[data-theme=light]{--bg:#f1f4f8;--panel:#ffffff;--line:#d3dae3;--text:#1c2733;--dim:#617285;--ok:#15803d;--bad:#dc2626;--warn:#b45309;--acc:#2563eb;--ed:#f7f9fc;--btn:#e7ecf3;--hover:#eef2f8;--sel:#d8e5fb;--menu:#ffffff;--pillbg:#e1e7ef;--off:#a5b1c0;--lnum:#9aa9ba;--onfg:#ffffff}
[data-theme=light] #pop,[data-theme=light] #menu{box-shadow:0 6px 22px #0003}
[data-theme=terminal]{--bg:#000600;--panel:#020f03;--line:#0f3d14;--text:#3dff6e;--dim:#1fa84a;--ok:#b6ffc8;--bad:#ff5d5d;--warn:#ffee55;--acc:#3dff6e;--ed:#000a02;--btn:#052a0b;--hover:#08240d;--sel:#0e4a1a;--menu:#031a06;--pillbg:#0a2a10;--off:#14532d;--lnum:#157a35;--onfg:#001a07}
[data-theme=terminal] body,[data-theme=terminal] button,[data-theme=terminal] input,[data-theme=terminal] select{font-family:Consolas,'Lucida Console',monospace}
[data-theme=terminal] body{text-shadow:0 0 6px #1fff5a55}
[data-theme=terminal] section,[data-theme=terminal] header{border-radius:2px}
[data-theme=blueprint]{--bg:#0a2742;--panel:#0d3358;--line:#3b78b4;--text:#e8f3ff;--dim:#9cc3ea;--ok:#7dffb0;--bad:#ff8a8a;--warn:#ffd166;--acc:#ffd166;--ed:#082440;--btn:#14508a;--hover:#124377;--sel:#1d63a6;--menu:#0d3358;--pillbg:#19477c;--off:#5d8dbd;--lnum:#5d8dbd;--onfg:#04260f}
[data-theme=blueprint] body{background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:24px 24px}
[data-theme=blueprint] section{border-style:dashed}
[data-theme=solar]{--bg:#14110c;--panel:#1d1912;--line:#4a3b22;--text:#f1dfb8;--dim:#a89268;--ok:#ffd54a;--bad:#ff5a4a;--warn:#ffe066;--acc:#ff8c1a;--ed:#100d08;--btn:#3a2f1a;--hover:#2a2316;--sel:#5a4420;--menu:#251f14;--pillbg:#33291a;--off:#5c4e34;--lnum:#6b5a38;--onfg:#1a1000}
[data-theme=lcars]{--bg:#000;--panel:#07070d;--line:#3d2f4d;--text:#ffcc99;--dim:#cc99cc;--ok:#99ccff;--bad:#ff5555;--warn:#ffcc00;--acc:#ff9900;--acc2:#cc99cc;--acc3:#9999ff}
[data-theme=lcars] body{font-family:'Antonio','Oswald','Bebas Neue','Arial Narrow',Arial,sans-serif;letter-spacing:.04em}
[data-theme=lcars] header{background:transparent;border:0;padding:10px 12px 4px 12px;gap:8px}
[data-theme=lcars] header h1{background:var(--acc);color:#000;text-transform:uppercase;letter-spacing:.16em;padding:6px 26px;border-radius:30px 0 0 30px;text-align:right}
[data-theme=lcars] .badge{background:var(--acc2);color:#000;border:0;border-radius:99px;padding:3px 14px;text-transform:uppercase}
[data-theme=lcars] .badge.run{background:var(--ok)}[data-theme=lcars] .badge.fault{background:var(--bad)}
[data-theme=lcars] section{border:0;border-left:20px solid var(--acc2);border-radius:34px 0 0 34px;background:var(--panel)}
[data-theme=lcars] section+section,[data-theme=lcars] main>section{border-left-color:var(--acc3)}
[data-theme=lcars] .left section:first-child{border-left-color:var(--acc)}
[data-theme=lcars] section h2{color:var(--acc);text-transform:uppercase;letter-spacing:.14em;border-bottom:2px solid var(--acc2);padding-left:18px}
[data-theme=lcars] button{border:0;border-radius:99px;background:var(--acc);color:#000;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 16px}
[data-theme=lcars] button.go{background:var(--acc3)}[data-theme=lcars] button.halt{background:#cc6666}
[data-theme=lcars] .tab{background:var(--acc2);border-radius:99px;color:#000;opacity:.6}[data-theme=lcars] .tab.on{background:var(--acc);opacity:1;border:0}
[data-theme=lcars] .chip{background:#2a2038;color:var(--acc2)}[data-theme=lcars] .chip.on{background:var(--acc2);color:#000;border:0}
[data-theme=lcars] th{color:var(--acc2)}
[data-theme=lcars] .gh b{color:var(--acc)}[data-theme=lcars] .code,[data-theme=lcars] .tb{color:var(--acc3)}
[data-theme=lcars] .pill.on{background:var(--ok)}
[data-theme=lcars] input[type=text],[data-theme=lcars] #props select,[data-theme=lcars] #props input{border-color:var(--acc2)}
[data-theme=lcars] .gh:hover,[data-theme=lcars] .row:hover,[data-theme=lcars] tr:hover td{background:#1c1428}
[data-theme=lcars] .tab.on{border:0}
/* Borg: black and Borg green, hard angles, red for faults. Selected in the theme picker; stored as 'borg'. */
[data-theme=borg]{--bg:#010301;--panel:#050c06;--line:#1b5a2b;--text:#8fe3a2;--dim:#4f8f5e;--ok:#39ff14;--bad:#ff2b2b;--warn:#d4ff00;--acc:#39ff14;--ed:#020602;--btn:#0e2514;--hover:#0a1b0e;--sel:#17492a;--menu:#08120a;--pillbg:#102b17;--off:#2d5d38;--lnum:#2f6d3d;--onfg:#001a05}
[data-theme=borg] body{background-image:repeating-linear-gradient(0deg,#39ff1408 0,#39ff1408 1px,transparent 1px,transparent 4px),linear-gradient(#39ff1406 1px,transparent 1px),linear-gradient(90deg,#39ff1406 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;font-family:Consolas,'Lucida Console','Courier New',monospace;text-shadow:0 0 5px #39ff1433}
[data-theme=borg] header{background:linear-gradient(90deg,#0b2a12,#050c06 60%);border-bottom:2px solid var(--acc)}
[data-theme=borg] header h1{text-transform:uppercase;letter-spacing:.22em;color:var(--acc);text-shadow:0 0 10px #39ff1488}
[data-theme=borg] header::after{content:'WE ARE THE BORG';margin-left:auto;color:var(--dim);letter-spacing:.3em;font-size:11px}
[data-theme=borg] section{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:0;background:var(--panel);box-shadow:inset 0 0 24px #39ff1408}
[data-theme=borg] section h2{color:var(--acc);text-transform:uppercase;letter-spacing:.18em;border-bottom:1px solid var(--line)}
[data-theme=borg] .badge{border-radius:0;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.12em}
[data-theme=borg] .badge.run{background:var(--ok);color:#001a05}
[data-theme=borg] .badge.fault{background:var(--bad);color:#fff;text-shadow:none}
[data-theme=borg] button,[data-theme=borg] select,[data-theme=borg] .tbtn{border-radius:0;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
[data-theme=borg] button:hover{background:var(--sel);border-color:var(--acc);box-shadow:0 0 8px #39ff1466}
[data-theme=borg] button.go{background:#0f5a1c;color:#caffd4}[data-theme=borg] button.halt{background:#5a1010;color:#ffd0d0}
[data-theme=borg] .tab,[data-theme=borg] .chip{border-radius:0}
[data-theme=borg] .tab.on,[data-theme=borg] .chip.on{background:var(--acc);color:#001a05;text-shadow:none}
[data-theme=borg] .pill{border-radius:0}
[data-theme=borg] th{color:var(--acc);text-transform:uppercase;letter-spacing:.1em}
[data-theme=borg] .gh b{color:var(--acc)}[data-theme=borg] .code,[data-theme=borg] .tb{color:#c8ff7a}
[data-theme=borg] input,[data-theme=borg] textarea,[data-theme=borg] #props select{border-radius:0;border-color:var(--line)}
[data-theme=borg] ::selection{background:#39ff1444}

.lessons{flex:1;overflow:auto;padding:10px 14px;display:none}
.lesson{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:12px;background:var(--ed)}
.lesson h3{margin:0 0 4px;font-size:15px;color:var(--acc)}
.lesson p{margin:4px 0}.lesson ol{margin:6px 0 8px 20px;padding:0}.lesson li{margin:2px 0}
.lesson .goal{color:var(--dim);font-size:12.5px}
.lesson .chal{color:var(--warn);font-size:13px}
.fb{padding:0 8px;font-size:12px;margin-right:3px}.fb.on{background:var(--ok);color:var(--onfg)}
td.frc{white-space:nowrap}.fi{width:64px;background:var(--ed);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:1px 4px;font:inherit}
.forced{color:var(--warn)}
.practice{flex:1;overflow:auto;padding:10px 14px;display:none}
.practice h3{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.practice svg{width:100%;max-height:300px;background:var(--ed);border:1px solid var(--line);border-radius:8px}
.pb-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pb-blurb{margin:8px 0 2px}.pb-task{margin:2px 0 8px}
.pb-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0}.pb-f{font-size:12.5px;color:var(--dim)}
.pb-hold.down{background:var(--ok);color:var(--onfg)}.practice ul{list-style:none;margin:0;padding:0}.practice li{padding:2px 0;color:var(--dim)}
.practice li.done{color:var(--ok)}.practice li.fail{color:var(--bad)}.pb-log{font:12px Consolas,monospace;color:var(--dim);max-height:110px;overflow:auto}
.practice details{margin-top:8px;color:var(--dim)}
</style></head><body>
<script>window.PLC_LIB="\n(* ---------- Generic blocks ---------- *)\n\nFUNCTION_BLOCK R_TRIG   (* Q is true for ONE scan when CLK goes from off to on *)\nVAR_INPUT CLK : BOOL; END_VAR\nVAR_OUTPUT Q : BOOL; END_VAR\nVAR M : BOOL; END_VAR\nQ := CLK AND NOT M;\nM := CLK;\nEND_FUNCTION_BLOCK\n\nFUNCTION_BLOCK F_TRIG   (* Q is true for ONE scan when CLK goes from on to off *)\nVAR_INPUT CLK : BOOL; END_VAR\nVAR_OUTPUT Q : BOOL; END_VAR\nVAR M : BOOL; END_VAR\nQ := NOT CLK AND M;\nM := CLK;\nEND_FUNCTION_BLOCK\n\nFUNCTION_BLOCK SR   (* Latch. Set turns Q1 on, Reset turns it off. Set wins if both are on *)\nVAR_INPUT S1 : BOOL; R : BOOL; END_VAR\nVAR_OUTPUT Q1 : BOOL; END_VAR\nQ1 := S1 OR (Q1 AND NOT R);\nEND_FUNCTION_BLOCK\n\nFUNCTION_BLOCK RS   (* Latch. Set turns Q1 on, Reset turns it off. Reset wins if both are on *)\nVAR_INPUT S : BOOL; R1 : BOOL; END_VAR\nVAR_OUTPUT Q1 : BOOL; END_VAR\nQ1 := NOT R1 AND (S OR Q1);\nEND_FUNCTION_BLOCK\n\nFUNCTION_BLOCK TOF   (* Off-delay timer. Q follows IN, but stays on for PT after IN turns off *)\nVAR_INPUT IN : BOOL; PT : TIME := T#1s; END_VAR\nVAR_OUTPUT Q : BOOL; END_VAR\nVAR T : TON; Armed : BOOL; END_VAR\nT(IN := Armed AND NOT IN, PT := PT);\nIF IN THEN\n    Armed := TRUE;\nEND_IF;\nIF T.Q THEN\n    Armed := FALSE;\nEND_IF;\nQ := IN OR Armed;\nEND_FUNCTION_BLOCK\n\nFUNCTION_BLOCK CTU   (* Up counter. CV counts rising edges of CU. Q is true when CV >= PV. R resets *)\nVAR_INPUT CU : BOOL; R : BOOL; PV : INT := 10; END_VAR\nVAR_OUTPUT Q : BOOL; CV : INT; END_VAR\nVAR M : BOOL; END_VAR\nIF R THEN\n    CV := 0;\nELSIF CU AND NOT M THEN\n    CV := CV + 1;\nEND_IF;\nM := CU;\nQ := CV >= PV;\nEND_FUNCTION_BLOCK\n\nFUNCTION_BLOCK BLINK   (* Flashes Q while ENABLE is on. Good for alarms and warning lights *)\nVAR_INPUT ENABLE : BOOL; ON_TIME : TIME := T#500ms; OFF_TIME : TIME := T#500ms; END_VAR\nVAR_OUTPUT Q : BOOL; END_VAR\nVAR TA : TON; TB : TON; END_VAR\nTA(IN := ENABLE AND NOT Q, PT := OFF_TIME);\nTB(IN := ENABLE AND Q, PT := ON_TIME);\nIF NOT ENABLE THEN\n    Q := FALSE;\nELSIF TA.Q THEN\n    Q := TRUE;\nELSIF TB.Q THEN\n    Q := FALSE;\nEND_IF;\nEND_FUNCTION_BLOCK\n\n(* ---------- Process control ---------- *)\n\nFUNCTION_BLOCK HYST   (* Two-limit switch with a gap. Q turns on at or below LOW and off at or above HIGH.\n                         INVERT := TRUE flips it: on at or above HIGH, off at or below LOW (coolers, vents). *)\nVAR_INPUT IN : REAL; LOW : REAL; HIGH : REAL; INVERT : BOOL; END_VAR\nVAR_OUTPUT Q : BOOL; END_VAR\nVAR State : BOOL; END_VAR\nIF IN <= LOW THEN\n    State := TRUE;\nELSIF IN >= HIGH THEN\n    State := FALSE;\nEND_IF;\nQ := State XOR INVERT;\nEND_FUNCTION_BLOCK\n\nFUNCTION_BLOCK PID   (* PID controller. KI is per second, KD is seconds. Output is limited to OUT_MIN..OUT_MAX\n                        and the integral is held inside the same limits (anti-windup). ENABLE off resets it. *)\nVAR_INPUT ENABLE : BOOL := TRUE; PV : REAL; SP : REAL; KP : REAL := 1.0; KI : REAL; KD : REAL;\n          OUT_MIN : REAL := 0.0; OUT_MAX : REAL := 100.0; END_VAR\nVAR_OUTPUT OUT : REAL; END_VAR\nVAR E : REAL; PrevE : REAL; Integ : REAL; Secs : REAL; Deriv : REAL; Fresh : BOOL := TRUE; END_VAR\nSecs := DT() / 1000.0;\nIF ENABLE THEN\n    E := SP - PV;\n    Integ := LIMIT(OUT_MIN, Integ + KI * E * Secs, OUT_MAX);\n    Deriv := 0.0;\n    IF Secs > 0.0 AND NOT Fresh THEN\n        Deriv := KD * (E - PrevE) / Secs;\n    END_IF;\n    OUT := LIMIT(OUT_MIN, KP * E + Integ + Deriv, OUT_MAX);\n    PrevE := E;\n    Fresh := FALSE;\nELSE\n    Integ := 0.0;\n    OUT := OUT_MIN;\n    Fresh := TRUE;\nEND_IF;\nEND_FUNCTION_BLOCK\n\n(* ---------- Stationeers blocks ---------- *)\n\nFUNCTION_BLOCK SOLAR_TRACK   (* Turns a solar sensor reading into panel settings.\n                                Horizontal passes straight through. Vertical is 90 - sensor (MODE 0) or sensor + 90 (MODE 1),\n                                the two forms in the Stationeers wiki solar guide. Pick the one that matches how the sensor is mounted. *)\nVAR_INPUT SENSOR_H : REAL; SENSOR_V : REAL; MODE : INT; END_VAR\nVAR_OUTPUT PANEL_H : REAL; PANEL_V : REAL; END_VAR\nPANEL_H := SENSOR_H;\nIF MODE = 1 THEN\n    PANEL_V := SENSOR_V + 90.0;\nELSE\n    PANEL_V := 90.0 - SENSOR_V;\nEND_IF;\nEND_FUNCTION_BLOCK\n\nFUNCTION_BLOCK AIRLOCK   (* Two-door airlock cycle with pressure checks, door locks and a safety timeout.\n   Pulse GO_IN to go to the station side, GO_OUT to go to the outside. The block closes and locks both doors,\n   pumps the chamber to the target pressure (FILL adds gas from the station, EVAC removes it), then opens only\n   the destination door. If the pressure is not reached before TIMEOUT it stops with FAULT on and both doors\n   locked. Pulse RESET to clear a fault. STATE: 0 idle, 1 closing, 2 equalising, 3 opening, 9 fault. *)\nVAR_INPUT\n    GO_IN : BOOL; GO_OUT : BOOL; RESET : BOOL;\n    PRESSURE : REAL;\n    TARGET_IN : REAL := 100.0; TARGET_OUT : REAL := 0.0; TOL : REAL := 2.0;\n    TIMEOUT : TIME := T#60s;\nEND_VAR\nVAR_OUTPUT\n    OPEN_IN : BOOL; OPEN_OUT : BOOL; LOCK_IN : BOOL; LOCK_OUT : BOOL;\n    FILL : BOOL; EVAC : BOOL; BUSY : BOOL; FAULT : BOOL; STATE : INT;\nEND_VAR\nVAR Goal : REAL; ToInside : BOOL; MIn : BOOL; MOut : BOOL; Settle : TON; Limit : TON; END_VAR\nSettle(IN := STATE = 1, PT := T#1500ms);\nLimit(IN := STATE = 2, PT := TIMEOUT);\nIF STATE = 0 THEN\n    IF GO_IN AND NOT MIn THEN\n        ToInside := TRUE;\n        Goal := TARGET_IN;\n        STATE := 1;\n    ELSIF GO_OUT AND NOT MOut THEN\n        ToInside := FALSE;\n        Goal := TARGET_OUT;\n        STATE := 1;\n    END_IF;\nELSIF STATE = 1 THEN\n    IF Settle.Q THEN\n        STATE := 2;\n    END_IF;\nELSIF STATE = 2 THEN\n    FILL := PRESSURE < Goal - TOL;\n    EVAC := PRESSURE > Goal + TOL;\n    IF NOT FILL AND NOT EVAC THEN\n        STATE := 3;\n    ELSIF Limit.Q THEN\n        STATE := 9;\n    END_IF;\nELSIF STATE = 3 THEN\n    OPEN_IN := ToInside; OPEN_OUT := NOT ToInside;\n    LOCK_IN := NOT ToInside; LOCK_OUT := ToInside;\n    STATE := 0;\nELSIF STATE = 9 THEN\n    IF RESET THEN\n        STATE := 0;\n    END_IF;\nEND_IF;\n(* Safe outputs for the state we are now in: both doors shut and locked while cycling or faulted, pumps only while equalising *)\nIF STATE = 1 OR STATE = 2 OR STATE = 9 THEN\n    OPEN_IN := FALSE; OPEN_OUT := FALSE; LOCK_IN := TRUE; LOCK_OUT := TRUE;\nEND_IF;\nIF STATE <> 2 THEN\n    FILL := FALSE; EVAC := FALSE;\nEND_IF;\nMIn := GO_IN;\nMOut := GO_OUT;\nBUSY := STATE = 1 OR STATE = 2 OR STATE = 3;\nFAULT := STATE = 9;\nEND_FUNCTION_BLOCK\n";</script>
<script>/* =====================================================================================================================
   Practice Bench: Structured Text engine (JavaScript port of StRuntime.cs + StLibrary.cs)

   Same language as the in-game PLC: PROGRAM / VAR, BOOL INT UINT DINT WORD REAL TIME TON, AT %IX %QX %IW %QW,
   IF / ELSIF / ELSE, WHILE, AND OR XOR NOT, + - * / MOD, comparisons, ABS MIN MAX LIMIT DT(),
   FUNCTION_BLOCK (the built-in library, or your own).  Function blocks are inlined at each call, so a block is
   ordinary ST with private variables named "instance.variable".

   This file has no browser dependencies, so it can also be tested with node.
   ===================================================================================================================== */
(function (root) {
  'use strict';

  var MAX_TOKENS = 5000, MAX_DEPTH = 64, MAX_NODES = 20000, MAX_INSTANCES = 64;
  var TYPES = { BOOL: 1, INT: 1, UINT: 1, DINT: 1, WORD: 1, REAL: 1, TIME: 1 };

  function StError(msg, line) { this.message = 'line ' + line + ': ' + msg; }

  /* ---------------------------------------------------------------- lexer */
  function lex(s) {
    var t = [], i = 0, line = 1, n = s.length;
    while (i < n) {
      var c = s[i];
      if (c === '\n') { line++; i++; continue; }
      if (/\s/.test(c)) { i++; continue; }
      if (c === '(' && s[i + 1] === '*') {
        var e = s.indexOf('*)', i + 2);
        if (e < 0) throw new StError('comment not closed', line);
        for (var k = i; k < e; k++) if (s[k] === '\n') line++;
        i = e + 2; continue;
      }
      if (c === '/' && s[i + 1] === '/') { while (i < n && s[i] !== '\n') i++; continue; }
      if (c === '%') {
        var st = i++;
        while (i < n && (/[A-Za-z0-9]/.test(s[i]) || s[i] === '.')) i++;
        t.push({ k: 'addr', x: s.substring(st, i).toUpperCase(), line: line }); continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        var st2 = i;
        while (i < n && /[A-Za-z0-9_]/.test(s[i])) i++;
        var w = s.substring(st2, i);
        if ((w.toUpperCase() === 'T' || w.toUpperCase() === 'TIME') && s[i] === '#') {
          i++; var ts = i;
          while (i < n && (/[A-Za-z0-9]/.test(s[i]) || s[i] === '.')) i++;
          t.push({ k: 'time', x: s.substring(ts, i), line: line }); continue;
        }
        t.push({ k: 'id', x: w, line: line }); continue;
      }
      if (/[0-9]/.test(c)) {
        var st3 = i;
        while (i < n && (/[0-9]/.test(s[i]) || (s[i] === '.' && i + 1 < n && /[0-9]/.test(s[i + 1])))) i++;
        t.push({ k: 'num', x: s.substring(st3, i), line: line }); continue;
      }
      var two = s.substr(i, 2);
      if (two === ':=' || two === '<>' || two === '<=' || two === '>=') { t.push({ k: 'sym', x: two, line: line }); i += 2; continue; }
      if ('+-*/()<>=;:,.'.indexOf(c) >= 0) { t.push({ k: 'sym', x: c, line: line }); i++; continue; }
      throw new StError("unexpected character '" + c + "'", line);
    }
    return t;
  }

  function parseTime(s, err) {
    var total = 0, re = /([0-9.]+)([a-z]+)/g, m, lower = s.toLowerCase(), used = 0;
    while ((m = re.exec(lower)) !== null) {
      used += m[0].length;
      var n = parseFloat(m[1]);
      switch (m[2]) {
        case 'ms': total += n; break;
        case 's': total += n * 1000; break;
        case 'm': total += n * 60000; break;
        case 'h': total += n * 3600000; break;
        default: throw err("bad time unit '" + m[2] + "' in T#" + s);
      }
    }
    if (used !== lower.length || used === 0) throw err('bad time literal T#' + s);
    return total;
  }

  /* ---------------------------------------------------------------- library */
  var libCache = null, libError = null;
  function library(src) {
    if (libCache) return libCache;
    var defs = {};
    try { new Parser(lex(src || ''), defs, null).defsOnly(); }
    catch (e) { if (e instanceof StError) { defs = {}; libError = 'the built-in block library failed to load: ' + e.message; } else throw e; }
    libCache = defs; return defs;
  }

  /* ---------------------------------------------------------------- parser */
  function Parser(toks, defs, size) {
    this.t = toks; this.p = 0; this.defs = defs; this.scope = ''; this.insts = {}; this.stack = [];
    this.depth = 0; this.nodes = 0; this.size = size || 2048;
    this.prog = { vars: [], byName: {}, body: [] };
  }
  var P = Parser.prototype;
  P.cur = function () { return this.p < this.t.length ? this.t[this.p] : { k: 'end', x: '<end>', line: this.t.length ? this.t[this.t.length - 1].line : 1 }; };
  P.isKw = function (k) { var c = this.cur(); return c.k === 'id' && c.x.toUpperCase() === k; };
  P.isSym = function (s) { var c = this.cur(); return c.k === 'sym' && c.x === s; };
  P.err = function (m) { return new StError(m, this.cur().line); };
  P.expectKw = function (k) { if (!this.isKw(k)) throw this.err('expected ' + k + " but found '" + this.cur().x + "'"); this.p++; };
  P.expectSym = function (s) { if (!this.isSym(s)) throw this.err("expected '" + s + "' but found '" + this.cur().x + "'"); this.p++; };
  P.expectId = function () { if (this.cur().k !== 'id') throw this.err("expected a name but found '" + this.cur().x + "'"); return this.t[this.p++].x; };
  P.enter = function () { if (++this.depth > MAX_DEPTH) throw this.err('program is nested too deeply (limit ' + MAX_DEPTH + ' levels)'); };
  P.find = function (name) { return this.prog.byName[name.toUpperCase()] || null; };
  P.addVar = function (v) { this.prog.vars.push(v); this.prog.byName[v.name.toUpperCase()] = v; };

  P.defsOnly = function () {
    while (this.isKw('FUNCTION_BLOCK')) this.fbDef();
    if (this.cur().k !== 'end') throw this.err("expected FUNCTION_BLOCK but found '" + this.cur().x + "'");
  };

  P.program = function () {
    while (this.isKw('FUNCTION_BLOCK')) this.fbDef();
    this.expectKw('PROGRAM'); this.expectId();
    while (this.isKw('VAR') || this.isKw('VAR_INPUT') || this.isKw('VAR_OUTPUT')) this.parseVars();
    this.block(this.prog.body, ['END_PROGRAM']);
    this.expectKw('END_PROGRAM');
    return this.prog;
  };

  P.fbDef = function () {
    this.expectKw('FUNCTION_BLOCK');
    var def = { name: this.expectId(), toks: this.t, inputs: {}, decl: 0, body: 0 };
    var up = def.name.toUpperCase();
    if (this.defs[up] || up === 'TON' || TYPES[up]) throw this.err('a block or type named ' + def.name + ' already exists');
    def.decl = this.p;
    while (this.isKw('VAR_INPUT') || this.isKw('VAR_OUTPUT') || this.isKw('VAR')) {
      var input = this.isKw('VAR_INPUT'); this.p++;
      while (!this.isKw('END_VAR')) {
        if (this.cur().k === 'end') throw this.err('missing END_VAR');
        var names = [this.expectId()];
        while (this.isSym(',')) { this.p++; names.push(this.expectId()); }
        this.expectSym(':');
        while (!this.isSym(';')) { if (this.cur().k === 'end') throw this.err("missing ';' in a declaration"); this.p++; }
        this.p++;
        if (input) for (var i = 0; i < names.length; i++) def.inputs[names[i].toUpperCase()] = true;
      }
      this.p++;
    }
    def.body = this.p;
    while (!this.isKw('END_FUNCTION_BLOCK')) { if (this.cur().k === 'end') throw this.err('missing END_FUNCTION_BLOCK for ' + def.name); this.p++; }
    this.p++;
    this.defs[up] = def;
    // trial expansion so mistakes are reported even when nothing uses the block yet
    var sp = this.prog, sn = this.nodes, si = this.insts;
    this.prog = { vars: [], byName: {}, body: [] }; this.insts = {};
    try { this.createInstance('_chk', def); this.inlineBody(def, '_chk.', []); }
    finally { this.prog = sp; this.nodes = sn; this.insts = si; }
  };

  P.createInstance = function (full, def) {
    if (this.stack.indexOf(def.name) >= 0) throw this.err('block ' + def.name + ' cannot contain itself');
    if (Object.keys(this.insts).length >= MAX_INSTANCES) throw this.err('too many function block instances (limit ' + MAX_INSTANCES + ')');
    this.insts[full.toUpperCase()] = def;
    var st = this.t, sp = this.p, ss = this.scope;
    this.stack.push(def.name);
    try {
      this.t = def.toks; this.p = def.decl; this.scope = full + '.';
      while (this.isKw('VAR_INPUT') || this.isKw('VAR_OUTPUT') || this.isKw('VAR')) this.parseVars();
    } finally { this.stack.pop(); this.t = st; this.p = sp; this.scope = ss; }
  };

  P.inlineBody = function (def, prefix, into) {
    if (this.stack.indexOf(def.name) >= 0) throw this.err('block ' + def.name + ' cannot call itself');
    var st = this.t, sp = this.p, ss = this.scope;
    this.stack.push(def.name);
    try { this.t = def.toks; this.p = def.body; this.scope = prefix; this.block(into, ['END_FUNCTION_BLOCK']); }
    finally { this.stack.pop(); this.t = st; this.p = sp; this.scope = ss; }
  };

  P.constValue = function () {
    var neg = false, v;
    if (this.isSym('-')) { neg = true; this.p++; }
    var c = this.cur();
    if (c.k === 'num') { v = parseFloat(c.x); this.p++; }
    else if (c.k === 'time') { v = parseTime(c.x, this.err.bind(this)); this.p++; }
    else if (this.isKw('TRUE')) { this.p++; v = 1; }
    else if (this.isKw('FALSE')) { this.p++; v = 0; }
    else throw this.err('expected a constant value');
    return neg ? -v : v;
  };

  P.parseVars = function () {
    var open = this.cur().x.toUpperCase();
    if (this.scope === '' && open !== 'VAR') throw this.err(open + ' can only be used inside a FUNCTION_BLOCK (use VAR in the PROGRAM)');
    this.p++;
    while (!this.isKw('END_VAR')) {
      if (this.cur().k === 'end') throw this.err('missing END_VAR');
      var names = [this.expectId()], addr = null;
      if (this.isKw('AT')) {
        this.p++;
        if (this.cur().k !== 'addr') throw this.err('expected an address like %IW0 after AT');
        addr = this.t[this.p++].x;
      } else while (this.isSym(',')) { this.p++; names.push(this.expectId()); }
      this.expectSym(':');
      var type = this.expectId().toUpperCase(), init = 0;
      if (this.isSym(':=')) { this.p++; init = this.constValue(); }
      this.expectSym(';');
      for (var i = 0; i < names.length; i++) {
        var full = this.scope + names[i];
        if (this.find(full) || this.insts[full.toUpperCase()]) throw this.err("variable '" + names[i] + "' is declared twice");
        if (type !== 'TON' && this.defs[type]) {
          if (addr) throw this.err('a function block cannot have an address (AT)');
          this.createInstance(full, this.defs[type]); continue;
        }
        var v = { name: full, type: type, v: init, init: init, timer: type === 'TON', el: 0, q: false, preset: 0, bound: false, out: false, table: null, addr: 0 };
        if (type !== 'TON' && !TYPES[type]) throw this.err('type ' + type + ' is not supported (use BOOL INT UINT DINT REAL TIME TON, or a function block name)');
        if (addr) {
          if (this.scope !== '') throw this.err('addresses (AT) are only allowed in the PROGRAM; pass the value into the block through an input');
          this.bind(v, addr);
        }
        this.addVar(v);
      }
    }
    this.expectKw('END_VAR');
  };

  P.bind = function (v, a) {
    if (a.length < 4 || a[0] !== '%') throw this.err('bad address ' + a);
    var dir = a[1], size = a[2], num = a.substring(3), addr, dot = num.indexOf('.');
    if (size === 'X' && dot >= 0) {
      var by = parseInt(num.substring(0, dot), 10), bit = parseInt(num.substring(dot + 1), 10);
      if (isNaN(by) || isNaN(bit) || bit < 0 || bit > 7) throw this.err('bad bit address ' + a);
      addr = by * 8 + bit;
    } else { addr = parseInt(num, 10); if (isNaN(addr) || String(addr) !== num) throw this.err('bad address ' + a); }
    if (addr < 0 || addr >= this.size) throw this.err('address out of range ' + a);
    if (dir === 'I' && size === 'X') { v.table = 'DI'; v.type = 'BOOL'; }
    else if (dir === 'Q' && size === 'X') { v.table = 'COIL'; v.out = true; v.type = 'BOOL'; }
    else if (dir === 'I' && size === 'W') v.table = 'IR';
    else if (dir === 'Q' && size === 'W') { v.table = 'HR'; v.out = true; }
    else throw this.err('address must be %IX %QX %IW or %QW: ' + a);
    v.bound = true; v.addr = addr;
  };

  P.block = function (into, enders) {
    for (;;) {
      for (var i = 0; i < enders.length; i++) if (this.isKw(enders[i])) return;
      if (this.cur().k === 'end') throw this.err('missing ' + enders[0]);
      into.push(this.stmt());
    }
  };

  P.stmt = function () {
    if (++this.nodes > MAX_NODES) throw this.err('program expands to too many statements (limit ' + MAX_NODES + '); each function block call copies the block in');
    this.enter();
    try { return this.stmtCore(); } finally { this.depth--; }
  };

  P.stmtCore = function () {
    var self = this;
    if (this.isKw('IF')) {
      this.p++;
      var conds = [this.expr()], blocks = [], b = [];
      this.expectKw('THEN'); this.block(b, ['ELSIF', 'ELSE', 'END_IF']); blocks.push(b);
      while (this.isKw('ELSIF')) { this.p++; conds.push(this.expr()); this.expectKw('THEN'); var b2 = []; this.block(b2, ['ELSIF', 'ELSE', 'END_IF']); blocks.push(b2); }
      var els = null;
      if (this.isKw('ELSE')) { this.p++; els = []; this.block(els, ['END_IF']); }
      this.expectKw('END_IF'); this.expectSym(';');
      return function (c) {
        for (var i = 0; i < conds.length; i++) if (conds[i](c) !== 0) { for (var j = 0; j < blocks[i].length; j++) blocks[i][j](c); return; }
        if (els) for (var k = 0; k < els.length; k++) els[k](c);
      };
    }
    if (this.isKw('WHILE')) {
      this.p++;
      var cond = this.expr(), body = [];
      this.expectKw('DO'); this.block(body, ['END_WHILE']); this.expectKw('END_WHILE'); this.expectSym(';');
      return function (c) {
        var n = 0;
        while (cond(c) !== 0) {
          if (++n > 1000 || ++c.loops > 20000) throw new Error('WHILE loop ran too long (scan overrun)');
          for (var i = 0; i < body.length; i++) body[i](c);
        }
      };
    }
    var name = this.expectId(), full = this.scope + name;
    if (this.insts[full.toUpperCase()]) return this.fbCall(full, this.insts[full.toUpperCase()]);
    var v = this.find(full);
    if (!v) throw this.err("unknown variable '" + name + "'");
    if (v.timer) {
      var IN = null, PT = null;
      this.expectSym('(');
      while (!this.isSym(')')) {
        var arg = this.expectId().toUpperCase();
        this.expectSym(':=');
        var e = this.expr();
        if (arg === 'IN') IN = e; else if (arg === 'PT') PT = e; else throw this.err('TON has inputs IN and PT, not ' + arg);
        if (this.isSym(',')) this.p++;
      }
      this.expectSym(')'); this.expectSym(';');
      return function (c) {
        var inp = IN ? IN(c) !== 0 : false, pt = PT ? PT(c) : v.preset;
        v.preset = pt;
        if (inp) { v.el = Math.min(v.el + c.dt, pt); v.q = v.el >= pt; } else { v.el = 0; v.q = false; }
      };
    }
    if (!v.out && v.bound) throw this.err("'" + name + "' is an input (" + (v.table === 'DI' ? '%IX' : '%IW') + ') and cannot be assigned');
    this.expectSym(':=');
    var val = this.expr(); this.expectSym(';');
    return assign(v, val);
  };

  function assign(v, val) {
    var t = v.type;
    if (t === 'BOOL') return function (c) { v.v = val(c) !== 0 ? 1 : 0; };
    if (t === 'INT' || t === 'DINT' || t === 'UINT' || t === 'WORD') return function (c) { v.v = Math.trunc(val(c)); };
    return function (c) { v.v = val(c); };
  }

  P.fbCall = function (full, def) {
    var seq = [];
    this.expectSym('(');
    while (!this.isSym(')')) {
      var arg = this.expectId();

<script>/* =====================================================================================================================
   Practice Bench: simulated Stationeers devices and practice scenarios.

   A World owns the Modbus-style tables (the same four the real mod exposes: DI, COIL, IR, HR), a list of virtual
   devices, and a goal checker. Devices publish points exactly like real ones, so a program written here uses the
   same %IX / %QX / %IW / %QW addresses idea as in the game. Physics is deliberately simple but behaves the way the
   real things do: doors take time to move, pumps need time to change a pressure, a locked door ignores commands.
   No browser dependencies, so it can be tested with node.
   ===================================================================================================================== */
(function (root) {
  'use strict';

  var SIZE = 512;

  function World(scenarioId) {
    var self = this;
    function bools() { var a = []; for (var i = 0; i < SIZE; i++) a.push(false); return a; }
    function nums() { var a = []; for (var i = 0; i < SIZE; i++) a.push(0); return a; }
    this.store = { DI: bools(), COIL: bools(), IR: nums(), HR: nums(), coilAssigned: bools(), hrAssigned: bools() };
    this.next = { DI: 0, COIL: 0, IR: 0, HR: 0 };
    this.points = []; this.devices = []; this.time = 0; this.log = [];
    this.faults = {};            // named switches the learner can flip on the bench (leak, pump failure, ...)
    this.ui = {};                // live values the scene needs (button states, sliders)
    var sc = SCENARIOS[scenarioId] || SCENARIOS.lightbutton;
    this.scenario = sc; this.id = sc.id;
    sc.build(this);
    this.goals = sc.goals.map(function (g) { return { id: g.id, text: g.text, done: false, bonus: !!g.bonus }; });
    this.stats = {};
    if (sc.init) sc.init(this);
  }
  var W = World.prototype;

  W.addPoint = function (t, tag, dev, sig, scale) {
    var a = this.next[t]++;
    var p = { t: t, a: a, tag: tag, dev: dev, sig: sig, scale: scale || 1 };
    this.points.push(p);
    if (t === 'COIL') this.store.coilAssigned[a] = true;
    if (t === 'HR') this.store.hrAssigned[a] = true;
    return p;
  };
  /* Device helpers. Each returns the point so the device can read its command later. */
  W.device = function (tag, dev, step) {
    var w = this, d = { tag: tag, dev: dev, w: w, step: step || function () {} };
    d.di = function (sig, fn) { var p = w.addPoint('DI', tag, dev, sig); p.fn = fn; return p; };
    d.coil = function (sig, init) { var p = w.addPoint('COIL', tag, dev, sig); w.store.COIL[p.a] = !!init; return p; };
    d.ir = function (sig, fn, scale) { var p = w.addPoint('IR', tag, dev, sig, scale); p.fn = fn; return p; };
    d.hr = function (sig, init, scale) { var p = w.addPoint('HR', tag, dev, sig, scale); w.store.HR[p.a] = Math.round((init || 0) * (scale || 1)); return p; };

  W.step = function (dt) {

  W.pointsJson = function () {

  /* ------------------------------------------------------------------ scenarios */
  var SCENARIOS = {};

  SCENARIOS.lightbutton = {
    id: 'lightbutton', title: 'Light and button',
    blurb: 'A wall light and a push button. The simplest PLC job: read an input, drive an output.',
    task: 'Make the button control the light. Then try the bonus goals.',
    hint: 'Use a contact on the button’s Activate signal and a coil on the light’s On switch. For a toggle you will need a latch (SR block) or an edge (R_TRIG).',
    build: function (w) { w.light = addLight(w, 'SIM-Light'); w.button = addButton(w, 'SIM-Button', 'btn'); },
    goals: [
      { id: 'held', text: 'Light is ON while the button is held' },
      { id: 'released', text: 'Light goes OFF when the button is released' },
      { id: 'latch', bonus: true, text: 'Bonus: light STAYS on after release (a toggle or latch)' },
      { id: 'second', bonus: true, text: 'Bonus: the next press turns it OFF again' }
    ],
    init: function (w) { w.stats = { prev: false, presses: 0, settle: -1, firstOn: false }; },
    check: function (w, dt) {

      var s = w.stats, b = w.ui.btn, on = w.light.on();
      if (b && on) w.achieve('held');
      if (b && !s.prev) s.presses++;

      if (s.settle >= 0) {
        s.settle -= dt;
        if (b) s.settle = -1;
        else if (s.settle < 0) {
          if (s.presses === 1) { if (on) { w.achieve('latch'); s.firstOn = true; } else w.achieve('released'); }
          else if (s.firstOn && !on) w.achieve('second');

    }
  };

  SCENARIOS.beacon = {
    id: 'beacon', title: 'Warning beacon',
    blurb: 'A warning light that should flash. Practice timers, or use the BLINK block.',
    task: 'Make the light flash about once per second, with the light on roughly half of the time.',
    hint: 'The BLINK block does this in one step. Or build it with a TON timer that restarts itself.',
    build: function (w) { w.light = addLight(w, 'SIM-Beacon'); },
    goals: [
      { id: 'flash', text: 'Light switches on and off at least 6 times' },
      { id: 'duty', text: 'The light is on for between 30% and 70% of each flash' }
    ],
    init: function (w) { w.stats = { prev: false, last: 0, edges: 0, onT: 0, offT: 0, okCycles: 0 }; },
    check: function (w, dt) {

  };

  SCENARIOS.tank = {
    id: 'tank', title: 'Tank pump',
    blurb: 'A gas tank is being drawn down by consumers. A pump refills it. Keep the pressure in a safe band without wearing the pump out.',
    task: 'Keep the tank between 100 and 300 kPa for 60 seconds. The pump may not switch on and off more than 8 times in that minute.',
    hint: 'Switching at a single value makes the pump chatter. Use two limits with a gap: a HYST block, or Set/Reset coils. Try raising the demand slider.',
    build: function (w) {
      w.tank = { p: 150, band: 0, switches: 0, lastOn: false, history: [] };
      w.ui.demand = 3;
      var pump = w.device('SIM-Pump', 'Volume Pump'), pon = pump.coil('On', false);
      pump.state = { spin: 0, speed: 0 };
      pump.di('Power', function () { return true; });
      pump.di('On', function () { return w.cmd(pon); });
      pump.step = function (dt) {
        var on = w.cmd(pon) && !w.faults.pumpFail;
        pump.state.speed = approach(pump.state.speed, on ? 1 : 0, 1.5, dt);
        pump.state.spin += pump.state.speed * dt * 12;
        w.tank.p += pump.state.speed * 9 * (1 - w.tank.p / 450) * dt;
      };
      w.pump = pump; w.pumpCmd = pon;
      var t = w.device('SIM-Tank', 'Gas Tank');
      t.di('Power', function () { return true; });
      t.ir('Pressure', function () { return w.tank.p; });
      t.ir('Level', function () { return clamp(w.tank.p / 4.5, 0, 100); });
      t.step = function (dt) {
        var demand = w.ui.demand + (w.faults.leak ? 5 : 0);
        w.tank.p = Math.max(0, w.tank.p - demand * dt);
      };
    },
    goals: [{ id: 'band', text: 'Hold 100 to 300 kPa for 60 seconds' }, { id: 'wear', text: 'Pump switches 8 times or fewer in that minute' }],
    init: function (w) { w.stats = { inBand: 0, switches: 0, lastOn: false, min: 1e9, max: 0, mark: 0 }; },
    check: function (w, dt) {
      var s = w.stats, p = w.tank.p, on = w.cmd(w.pumpCmd);
      if (on !== s.lastOn) { s.lastOn = on; s.switches++; }
      if (p >= 100 && p <= 300) s.inBand += dt; else { s.inBand = 0; s.switches = 0; }
      if (p < 20 || p > 430) w.note(p < 20 ? 'Tank nearly empty!' : 'Tank over-pressure!');
      if (s.inBand >= 60) { w.achieve('band'); if (s.switches <= 8) w.achieve('wear'); }
    }
  };

  SCENARIOS.airlock = {
    id: 'airlock', title: 'Airlock',
    blurb: 'A two-door airlock between the station (100 kPa) and space (0 kPa). Two buttons call it inside or outside. Two pumps fill or empty the chamber.',
    task: 'Cycle the airlock in and out twice. Never open both doors at once, and never open a door while the chamber pressure is far from that side.',
    hint: 'The AIRLOCK block does all of this for you. Wire its outputs to the doors, locks and pumps, and its inputs to the buttons and the chamber Pressure. Then flip the faults on the bench to test its safety timeout.',
    build: function (w) {
      w.ch = { p: 0, breach: 0, blast: 0 };
      w.ui.goIn = false; w.ui.goOut = false;
      w.doorIn = addDoor(w, 'SIM-Door-In'); w.doorOut = addDoor(w, 'SIM-Door-Out');
      var fill = w.device('SIM-FillPump', 'Volume Pump'), fon = fill.coil('On', false);
      var evac = w.device('SIM-EvacPump', 'Volume Pump'), eon = evac.coil('On', false);
      fill.state = { spin: 0, speed: 0 }; evac.state = { spin: 0, speed: 0 };
      fill.di('On', function () { return w.cmd(fon); }); evac.di('On', function () { return w.cmd(eon); });
      w.fill = fill; w.evac = evac; w.fillCmd = fon; w.evacCmd = eon;
      var ch = w.device('SIM-Chamber', 'Gas Sensor');
      ch.ir('Pressure', function () { return w.ch.p; });
      addButton(w, 'SIM-Button-In', 'goIn'); addButton(w, 'SIM-Button-Out', 'goOut');
      ch.step = function (dt) {
        var P = w.ch.p, stationP = 100, spaceP = 0, pumpsOk = !w.faults.pumpFail;
        fill.state.speed = approach(fill.state.speed, w.cmd(fon) ? 1 : 0, 2, dt); evac.state.speed = approach(evac.state.speed, w.cmd(eon) ? 1 : 0, 2, dt);
        fill.state.spin += fill.state.speed * dt * 12; evac.state.spin += evac.state.speed * dt * 12;
        if (pumpsOk) {
          if (w.cmd(fon)) P += Math.min(12 * dt * fill.state.speed, Math.max(0, stationP - P));
          if (w.cmd(eon)) P -= Math.min(12 * dt * evac.state.speed, P);
        }
        var inO = w.doorIn.isOpen(), outO = w.doorOut.isOpen();
        if (inO) P += (stationP - P) * Math.min(1, 3 * dt);
        if (outO) P += (spaceP - P) * Math.min(1, 3 * dt);
        if (!inO && !outO && w.faults.leak) P = Math.max(0, P - 3 * dt);
        w.ch.p = clamp(P, 0, 120);
      };
    },
    goals: [
      { id: 'in2', text: 'Cycle in twice (inner door opened with the chamber pressurised)' },
      { id: 'out2', text: 'Cycle out twice (outer door opened with the chamber empty)' },
      { id: 'safe', text: 'Both doors never open at the same time' },
      { id: 'blast', text: 'No door opened against a big pressure difference' }
    ],
    init: function (w) { w.stats = { inN: 0, outN: 0, prevIn: false, prevOut: false, breaches: 0, blasts: 0, both: false }; },
    check: function (w) {
      var s = w.stats, inO = w.doorIn.state.pos > 0.2, outO = w.doorOut.state.pos > 0.2, P = w.ch.p;

      if (outO && !s.prevOut) { if (Math.abs(P) > 30) { s.blasts++; w.note('Outer door opened against ' + Math.round(P) + ' kPa!'); } else s.outN++; }

      s.both = both; s.prevIn = inO; s.prevOut = outO;

      if (s.outN >= 2) w.achieve('out2');
      var g = w.goal('safe'), b = w.goal('blast');
      if (s.inN >= 2 && s.outN >= 2) { if (s.breaches === 0) w.achieve('safe'); if (s.blasts === 0) w.achieve('blast'); }
      if (s.breaches > 0 && g) g.failed = true;
      if (s.blasts > 0 && b) b.failed = true;
    }
  };

  var ORDER = ['lightbutton', 'beacon', 'tank', 'airlock'];

  root.SimWorld = { World: World, SCENARIOS: SCENARIOS, ORDER: ORDER, SIZE: SIZE };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.SimWorld;

<script>/* Offline shim: answers the workstation's /api/* calls from the simulated world, so the very same page works
   without the game. Also drives the simulation clock. Needs engine.js and world.js loaded first. */
(function (root) {
  'use strict';
  var realFetch = root.fetch ? root.fetch.bind(root) : null;
  var bench = { world: null, plc: null, ladder: '', listeners: [], scenario: 'lightbutton' };
  var LIBSRC = root.PLC_LIB || '';

  function load(id) {
    var src = bench.plc ? bench.plc.source : null;
    bench.world = new SimWorld.World(id);
    bench.plc = new StSim.Plc(bench.world.store, LIBSRC);
    if (src) bench.plc.install(src);
    bench.scenario = id;
    bench.listeners.forEach(function (f) { try { f(); } catch (e) {} });
  }
  bench.load = load;
  bench.onChange = function (f) { bench.listeners.push(f); };

  function resp(body, status, type) {
    status = status || 200;
    return Promise.resolve({
      ok: status >= 200 && status < 300, status: status,
      json: function () { return Promise.resolve(JSON.parse(body)); },
      text: function () { return Promise.resolve(body); }
    });
  }
  function q(url, k) { var m = new RegExp('[?&]' + k + '=([^&]*)').exec(url); return m ? decodeURIComponent(m[1]) : null; }

  root.fetch = function (url, opt) {
    url = String(url);
    if (url.indexOf('/api/') !== 0) return realFetch ? realFetch(url, opt) : Promise.reject(new Error('offline'));
    var post = opt && opt.method === 'POST', body = opt && opt.body, p = url.split('?')[0], plc = bench.plc, w = bench.world;
    if (!post) {
      if (p === '/api/state') return resp(JSON.stringify(plc.stateJson('SIM-')));
      if (p === '/api/points') return resp(JSON.stringify(w.pointsJson()));
      if (p === '/api/program') return resp(plc.source);
      if (p === '/api/ladder') return resp(bench.ladder);
    } else {
      if (p === '/api/program') { plc.install(String(body || '')); return resp('queued'); }
      if (p === '/api/ladder') { bench.ladder = String(body || ''); try { localStorage.setItem('plcBenchLadder', bench.ladder); } catch (e) {} return resp('saved'); }
      if (p === '/api/check') return resp(JSON.stringify(plc.check(String(body || ''))));
      if (p === '/api/mode') { plc.requestMode(q(url, 'run') === '1', performance.now()); return resp('queued'); }
      if (p === '/api/prune') return resp('queued');
      if (p === '/api/force') {
        var n = q(url, 'name');
        if (q(url, 'release') === '1') plc.force(n, null); else plc.force(n, parseFloat(q(url, 'value')));
        return resp('queued');
      }
      if (p === '/api/write') {
        var a = parseInt(q(url, 'addr'), 10), v = q(url, 'value');
        if (!(a >= 0 && a < SimWorld.SIZE)) return resp('bad address', 400);
        if (plc.running && plc.blockExternal) return resp('The program is running and owns the outputs. Press Stop first.', 409);
        if (!w.store.coilAssigned[a]) return resp('That address is not an assigned switch.', 409);
        w.store.COIL[a] = v === '1';
        return resp('queued');
      }
    }
    return resp('not found', 404);
  };

  var last = performance.now();
  setInterval(function () {
    var now = performance.now(), dt = (now - last) / 1000; last = now;
    if (!bench.world) return;
    bench.world.step(dt);
    bench.plc.tick(now, 100);
  }, 50);

  try { bench.ladder = localStorage.getItem('plcBenchLadder') || ''; } catch (e) {}
  root.Bench = bench;
  load('lightbutton');
})(window);
</script>

<script>
var H={'X-Plc':'1'},pts=[],ed=document.getElementById('ed'),msg=document.getElementById('msg'),dirty=false,pop=document.getElementById('pop'),items=[],sel=0,errLine=0,chkTimer=0;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function post(u,b){return fetch(u,{method:'POST',headers:H,body:b})}

var LIB=[
 {l:'PROGRAM',k:'kw',d:'Start of the program: PROGRAM Main'},
 {l:'END_PROGRAM',k:'kw',d:'End of the program'},
 {l:'VAR',k:'kw',d:'Start of the variable declarations'},
 {l:'END_VAR',k:'kw',d:'End of the variable declarations'},
 {l:'FUNCTION_BLOCK',k:'kw',d:'Define your own block: FUNCTION_BLOCK Name ... END_FUNCTION_BLOCK (put it before PROGRAM)'},{l:'END_FUNCTION_BLOCK',k:'kw',d:'Ends your block'},
 {l:'VAR_INPUT',k:'kw',d:'Inside a block: values passed in when it is called'},{l:'VAR_OUTPUT',k:'kw',d:'Inside a block: values the program can read as Name.Output'},
 {l:'HYST',k:'type',d:'Block: on at/below LOW, off at/above HIGH. Inputs IN LOW HIGH INVERT, output Q'},
 {l:'PID',k:'type',d:'Block: PID controller. Inputs ENABLE PV SP KP KI KD OUT_MIN OUT_MAX, output OUT'},
 {l:'AIRLOCK',k:'type',d:'Block: full two-door airlock cycle with locks, pumps and timeout. See the Airlock lesson'},
 {l:'SOLAR_TRACK',k:'type',d:'Block: sensor angles to solar panel settings. Inputs SENSOR_H SENSOR_V MODE, outputs PANEL_H PANEL_V'},
 {l:'R_TRIG',k:'type',d:'Block: Q is on for one scan when CLK turns on'},{l:'F_TRIG',k:'type',d:'Block: Q is on for one scan when CLK turns off'},
 {l:'SR',k:'type',d:'Block: latch, Set wins. Inputs S1 R, output Q1'},{l:'RS',k:'type',d:'Block: latch, Reset wins. Inputs S R1, output Q1'},
 {l:'TOF',k:'type',d:'Block: off-delay timer. Inputs IN PT, output Q'},{l:'CTU',k:'type',d:'Block: up counter. Inputs CU R PV, outputs Q CV'},
 {l:'BLINK',k:'type',d:'Block: flasher. Inputs ENABLE ON_TIME OFF_TIME, output Q'},
 {l:'DT',k:'fn',i:'DT()',d:'DT(): milliseconds since the previous scan'},
 {l:'IF',k:'kw',d:'IF condition THEN ... END_IF;'},{l:'THEN',k:'kw',d:''},{l:'ELSIF',k:'kw',d:'Another condition to test'},{l:'ELSE',k:'kw',d:'Runs when no condition was true'},{l:'END_IF',k:'kw',d:'Ends an IF (needs a ;)'},
 {l:'WHILE',k:'kw',d:'Repeat while true (max 1000 loops per scan)'},{l:'DO',k:'kw',d:''},{l:'END_WHILE',k:'kw',d:'Ends a WHILE (needs a ;)'},
 {l:'AND',k:'op',d:'True when both sides are true'},{l:'OR',k:'op',d:'True when either side is true'},{l:'XOR',k:'op',d:'True when exactly one side is true'},{l:'NOT',k:'op',d:'Flips true and false'},{l:'MOD',k:'op',d:'Remainder after division'},
 {l:'TRUE',k:'const',d:'Boolean 1'},{l:'FALSE',k:'const',d:'Boolean 0'},{l:'AT',k:'kw',d:'Ties a variable to a Modbus address: Name AT %QX12 : BOOL;'},
 {l:'BOOL',k:'type',d:'On/off value'},{l:'INT',k:'type',d:'Whole number (16-bit register)'},{l:'UINT',k:'type',d:'Whole number, unsigned'},{l:'DINT',k:'type',d:'Larger whole number (internal only)'},{l:'REAL',k:'type',d:'Decimal number (internal only)'},{l:'TIME',k:'type',d:'A duration in ms, written T#5s'},{l:'TON',k:'type',d:'On-delay timer. Use T(IN := x, PT := T#2s); then T.Q'},
 {l:'ABS',k:'fn',i:'ABS(',d:'ABS(x): absolute value'},{l:'MIN',k:'fn',i:'MIN(',d:'MIN(a, b): smaller one'},{l:'MAX',k:'fn',i:'MAX(',d:'MAX(a, b): larger one'},{l:'LIMIT',k:'fn',i:'LIMIT(',d:'LIMIT(min, x, max): clamp x'},

function declared(){
  var t=ed.value.replace(/\(\*[\s\S]*?\*\)/g,function(m){return m.replace(/[^\n]/g,' ')}).replace(/\/\/.*$/gm,'');
  var out=[],re=/([A-Za-z_]\w*(?:\s*,\s*[A-Za-z_]\w*)*)\s*(AT\s+%[A-Za-z0-9.]+\s*)?:\s*([A-Za-z]\w*)\s*(?::=[^;]*)?;/g,m;
  while((m=re.exec(t))!==null){var ty=m[3].toUpperCase(),at=m[2]?m[2].replace(/AT\s+/,'').trim():'';
    m[1].split(',').forEach(function(n){out.push({n:n.trim(),t:ty,at:at})})}
  return out;
}
function addrItems(q){
  var out=[];q=q.toLowerCase();
  for(var i=0;i<pts.length&&out.length<14;i++){var p=pts[i];if(!p.act)continue;
    var pre=p.t==='DI'?'%IX':p.t==='COIL'?'%QX':p.t==='IR'?'%IW':'%QW',lab=pre+p.a,info=p.tag+'  '+p.sig+'  ('+p.dev+')';
    if(lab.toLowerCase().indexOf(q)===0||(q.length>1&&info.toLowerCase().indexOf(q.replace('%',''))>=0))out.push({l:lab,k:p.t,d:info});}
  return out;
}
function build(force){
  var pos=ed.selectionStart,before=ed.value.substring(0,pos),m=/[%A-Za-z_#][A-Za-z0-9_.]*$/.exec(before),pre=m?m[0]:'';
  if(!force&&pre.length<1)return {pre:pre,list:[]};
  var q=pre.toLowerCase(),list=[],vars=declared(),dot=pre.indexOf('.');
  if(pre.charAt(0)==='%'&&dot<0||pre.charAt(0)==='%'&&pre.length<4){list=addrItems(pre)}
  else if(dot>0){
    var base=pre.substring(0,dot).toLowerCase(),mem=pre.substring(dot+1).toLowerCase();
    vars.forEach(function(v){if(v.t==='TON'&&v.n.toLowerCase()===base){
      [['Q','true when the time has run out'],['ET','elapsed time in ms']].forEach(function(x){if(x[0].toLowerCase().indexOf(mem)===0)list.push({l:v.n+'.'+x[0],k:'mem',i:v.n+'.'+x[0],d:x[1]})})}});
  } else {
    vars.forEach(function(v){if(v.n.toLowerCase().indexOf(q)===0&&v.n.toLowerCase()!==q)list.push({l:v.n,k:v.t,d:v.at?('at '+v.at):'variable'})});
    LIB.forEach(function(x){if(x.l.toLowerCase().indexOf(q)===0&&(x.l.toLowerCase()!==q||x.k==='snip'))list.push(x)});
  }
  return {pre:pre,list:list.slice(0,14)};
}
function caretXY(){
  var mir=$('mir'),r=ed.getBoundingClientRect();
  mir.textContent=ed.value.substring(0,ed.selectionStart);
  var sp=document.createElement('span');sp.textContent='.';mir.appendChild(sp);
  var mr=mir.getBoundingClientRect(),sr=sp.getBoundingClientRect();
  return {x:r.left+(sr.left-mr.left)-ed.scrollLeft,y:r.top+(sr.top-mr.top)-ed.scrollTop+19};
}
function showPop(force){
  var b=build(force);items=b.list;sel=0;
  if(!items.length){pop.style.display='none';return}
  draw2();pop.style.display='block';
  var xy=caretXY(),w=pop.offsetWidth,h=pop.offsetHeight;
  pop.style.left=Math.max(4,Math.min(xy.x,window.innerWidth-w-8))+'px';
  var top=xy.y+2;if(top+h>window.innerHeight-8)top=Math.max(4,xy.y-h-24);
  pop.style.top=top+'px';
}
function draw2(){
  var h='';items.forEach(function(x,i){h+='<div data-i=\''+i+'\' class=\''+(i===sel?'sel':'')+'\'><em>'+esc(x.k)+'</em><b>'+esc(x.l)+'</b><i>'+esc(x.d||'')+'</i></div>'});
  pop.innerHTML=h;var s=pop.querySelector('.sel');if(s&&s.scrollIntoView)s.scrollIntoView({block:'nearest'});
}
function hidePop(){pop.style.display='none';items=[]}
function accept(i){
  var x=items[i];if(!x)return;var b=build(true),pre=b.pre,pos=ed.selectionStart,start=pos-pre.length,ins=x.i||x.l,caret=ins.indexOf('|');
  if(caret>=0)ins=ins.replace('|','');else caret=ins.length;
  ed.value=ed.value.substring(0,start)+ins+ed.value.substring(pos);
  ed.selectionStart=ed.selectionEnd=start+caret;hidePop();onEdit(true);ed.focus();
}
pop.addEventListener('mousedown',function(e){var d=e.target.closest('div[data-i]');if(d){e.preventDefault();accept(parseInt(d.getAttribute('data-i'),10))}});

function lines(){var n=ed.value.split('\n').length,t='';for(var i=1;i<=n;i++)t+=i+'\n';$('ln').textContent=t}
ed.addEventListener('scroll',function(){$('ln').scrollTop=ed.scrollTop;hidePop()});
function onEdit(noPop){dirty=true;lines();if(!noPop)showPop(false);clearTimeout(chkTimer);chkTimer=setTimeout(check,350)}
ed.addEventListener('input',function(){onEdit(false)});
ed.addEventListener('click',hidePop);
ed.addEventListener('blur',function(){setTimeout(hidePop,150)});
ed.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.code==='Space'){e.preventDefault();showPop(true);return}
  if(pop.style.display==='block'&&items.length){
    if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%items.length;draw2();return}
    if(e.key==='ArrowUp'){e.preventDefault();sel=(sel+items.length-1)%items.length;draw2();return}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();accept(sel);return}
    if(e.key==='Escape'){e.preventDefault();hidePop();return}
  }
  if(e.key==='Tab'){e.preventDefault();var s=ed.selectionStart;ed.value=ed.value.slice(0,s)+'    '+ed.value.slice(ed.selectionEnd);ed.selectionStart=ed.selectionEnd=s+4;onEdit(true)}
});

function check(){
  post('/api/check',ed.value).then(function(r){return r.json()}).then(function(c){
    var m=/line (\d+)/.exec(c.error||'');errLine=m?parseInt(m[1],10):0;
    if(!c.ok){msg.className='msg err';msg.textContent='Error: '+c.error+(errLine?'  (click to jump)':'')}
    else if(c.warning){msg.className='msg warn';msg.textContent='Warning: '+c.warning}
    else{msg.className='msg okm';msg.textContent='No problems found.'}
  }).catch(function(){});
}
msg.addEventListener('click',function(){
  if(!errLine)return;var ls=ed.value.split('\n'),idx=0;for(var i=0;i<errLine-1&&i<ls.length;i++)idx+=ls[i].length+1;
  ed.focus();ed.selectionStart=idx;ed.selectionEnd=idx+(ls[errLine-1]||'').length;ed.scrollTop=Math.max(0,(errLine-3)*19);
});

$('bc').onclick=function(){post('/api/program',ed.value);dirty=false;msg.className='msg';msg.textContent='Compiling...'};
$('br').onclick=function(){if(dirty){post('/api/program',ed.value);dirty=false}setTimeout(function(){post('/api/mode?run=1')},300)};
$('bs').onclick=function(){post('/api/mode?run=0')};
var cat='all',openG={},shown=[],NP='';
function nice(x){return String(x).replace(/([a-z0-9])([A-Z])/g,'$1 $2')}
function addrOf(p){return (p.t==='DI'?'%IX':p.t==='COIL'?'%QX':p.t==='IR'?'%IW':'%QW')+p.a}
var KIND={DI:'status',COIL:'switch',IR:'reading',HR:'setpoint'};
function draw(){
  var q=$('f').value.toLowerCase().trim(),hide=$('hideoff').checked,groups={},order=[];
  pts.forEach(function(p,idx){
    if(hide&&!p.act)return; if(cat!=='all'&&p.t!==cat)return;
    if(q&&(p.tag+' '+p.dev+' '+p.sig+' '+nice(p.sig)+' '+addrOf(p)+' '+KIND[p.t]).toLowerCase().indexOf(q)<0)return;
    var g=groups[p.tag];if(!g){g=groups[p.tag]={tag:p.tag,dev:p.dev,rows:[]};order.push(g)}
    g.rows.push({p:p,i:idx});
  });
  var h='',nopen=order.length<=6||q.length>0;
  if(!order.length)h='<div class=\'empty\'>'+(pts.length?'Nothing matches. Try another filter.':(NP?'Only devices whose name starts with \"'+esc(NP)+'\" are listed. Rename a device in the game (for example '+esc(NP)+'-Light) and it will appear here.':'No devices yet. Load a world and wait a few seconds.'))+'</div>';
  order.forEach(function(g){
    var open=openG[g.tag]===undefined?nopen:openG[g.tag];
    h+='<div class=\'grp\'><div class=\'gh\' data-g=\''+esc(g.tag)+'\'><span class=\'car\'>'+(open?'▾':'▸')+'</span><b>'+esc(nice(g.tag.replace(/_/g,' ')))+'</b><span>'+esc(nice(g.dev))+'</span><span class=\'cnt\'>'+g.rows.length+(g.rows.length===1?' point':' points')+'</span></div>';
    if(open)g.rows.forEach(function(r){var p=r.p,isb=p.t==='DI'||p.t==='COIL',on=isb&&p.raw===1;
      var v=isb?(p.t==='COIL'&&p.act?'<button class=\'pill tg'+(on?' on':'')+'\' data-a=\''+p.a+'\' data-on=\''+(on?1:0)+'\' title=\'Click to switch this device '+(on?'off':'on')+' in the game\'>'+(on?'ON':'OFF')+'</button>':'<span class=\'pill'+(on?' on':'')+'\'>'+(on?'ON':'OFF')+'</span>'):'<span class=\'val\'>'+esc(p.eng)+'</span>';
      h+='<div class=\'row'+(p.act?'':' off')+'\'><div class=\'nm\'>'+esc(nice(p.sig))+'<small>'+KIND[p.t]+(p.t==='COIL'||p.t==='HR'?' · PLC can change':' · read only')+'</small></div><div class=\'code\'>'+addrOf(p)+'</div><div>'+v+'</div><div><button class=\'use\' data-i=\''+r.i+'\' title=\'Add this to your program\'>+ use</button></div></div>';});
    h+='</div>';
  });
  $('iolist').innerHTML=h;
  var offN=pts.filter(function(p){return !p.act}).length;
  $('prune').style.display=offN?'':'none';$('prune').textContent='Remove '+offN+' offline point'+(offN===1?'':'s');
  $('npnote').textContent=NP?'only names starting with "'+NP+'"':'';
  if(window.onPoints)onPoints();
}
$('f').addEventListener('input',draw);$('hideoff').addEventListener('change',draw);
$('prune').onclick=function(){
  if(window.stRun){alert('Press Stop first. Offline points cannot be removed while the program is running.');return}
  var n=pts.filter(function(p){return !p.act}).length;
  if(!confirm('Remove '+n+' offline point(s) from the I/O list?\n\nTheir addresses will not be reused. A program that still uses one of these addresses will refuse to Run until you change it.'))return;
  post('/api/prune');
};
$('chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;cat=b.getAttribute('data-c');[].forEach.call(document.querySelectorAll('.chip'),function(c){c.className='chip'+(c===b?' on':'')});draw()});
$('iolist').addEventListener('click',function(e){
  var t=e.target.closest('.tg');if(t){var want=t.getAttribute('data-on')==='1'?0:1;
    fetch('/api/write?addr='+t.getAttribute('data-a')+'&value='+want,{method:'POST',headers:{'X-Plc':'1'}}).then(function(r){return r.text().then(function(x){if(!r.ok)alert(x)})});return}
  var u=e.target.closest('.use');if(u){if(window.useIO)useIO(pts[parseInt(u.getAttribute('data-i'),10)]);return}
  var g=e.target.closest('.gh');if(g){var t=g.getAttribute('data-g'),was=g.querySelector('.car').textContent==='▾';openG[t]=!was;draw()}});
function renderVarRows(list){
  var h='';
  list.forEach(function(v){
    var n=esc(v.n),canForce=v.t!=='TON'&&!/^%Q/.test(v.at||'')&&v.n.indexOf('.')<0,f='';
    if(canForce){
      if(v.t==='BOOL')f='<button class=\'fb\' data-n=\''+n+'\' data-v=\'0\'>0</button><button class=\'fb\' data-n=\''+n+'\' data-v=\'1\'>1</button>';
      else f='<input class=\'fi\' type=\'number\' data-n=\''+n+'\' placeholder=\'value\' title=\'type a number, press Enter\'>';
      if(v.f)f+='<button class=\'fb on\' data-n=\''+n+'\' data-r=\'1\' title=\'Stop forcing\'>release</button>';
    }
    h+='<tr><td'+(v.f?' class=forced':'')+'>'+n+(v.f?' (forced)':'')+'</td><td>'+v.t+'</td><td class=tb>'+esc(v.at||'')+'</td><td class=n>'+esc(v.v)+'</td><td class=frc>'+f+'</td></tr>';
  });
  $('vars').innerHTML=h;
}
$('vars').addEventListener('click',function(e){var b=e.target.closest('button.fb');if(!b)return;var n=b.getAttribute('data-n');
  if(b.getAttribute('data-r'))post('/api/force?name='+encodeURIComponent(n)+'&release=1');else post('/api/force?name='+encodeURIComponent(n)+'&value='+b.getAttribute('data-v'))});
$('vars').addEventListener('keydown',function(e){if(e.key!=='Enter')return;var i=e.target.closest('input.fi');if(!i||i.value==='')return;post('/api/force?name='+encodeURIComponent(i.getAttribute('data-n'))+'&value='+encodeURIComponent(i.value));i.value='';i.blur()});
function poll(){
  fetch('/api/state').then(function(r){return r.json()}).then(function(s){
    window.stRun=!!s.running;
    var b=$('st');b.textContent=s.fault?'FAULT':(s.running?'RUN':'STOP');b.className='badge '+(s.fault?'fault':(s.running?'run':'stop'));
    $('scan').textContent=s.running?('scan '+s.scanMs+' ms  #'+s.scans):(s.blockExternal?'external writes blocked while RUN':'');
    if(!dirty){
      if(s.compileError){msg.className='msg err';msg.textContent='Compile error: '+s.compileError;var m=/line (\d+)/.exec(s.compileError);errLine=m?parseInt(m[1],10):0}
      else if(s.fault){msg.className='msg err';errLine=0;msg.textContent=s.fault}
      else{msg.className='msg okm';msg.textContent=s.running?'Running.':'Compiled OK. Press Run to start.'}
    }
    NP=s.prefix||'';if(window.onState)onState(s);
    if(!$('vars').contains(document.activeElement))renderVarRows(s.vars||[]);
  }).catch(function(){$('st').textContent='OFFLINE';$('st').className='badge fault'});
  fetch('/api/points').then(function(r){return r.json()}).then(function(p){pts=p;draw()}).catch(function(){});
}
fetch('/api/program').then(function(r){return r.text()}).then(function(t){ed.value=t;lines()});
poll();setInterval(poll,1000);
</script>
<script>
/* ===== Theme ===== */
(function(){
  var sel=$('thm'),cur='';
  try{cur=localStorage.getItem('plcTheme')||''}catch(e){}
  function apply(t){if(t){document.documentElement.setAttribute('data-theme',t)}else{document.documentElement.removeAttribute('data-theme')}sel.value=t}
  if(['','light','lcars','terminal','blueprint','solar','borg'].indexOf(cur)<0)cur='';
  apply(cur);
  sel.onchange=function(){cur=sel.value;apply(cur);try{localStorage.setItem('plcTheme',cur)}catch(e){}if(window.renderLadder)renderLadder(true)};
})();

/* ===== Ladder editor ===== */
var LD={vars:[],rungs:[]},W={},SEL=null,MAP={},tab='ladder',mdown=false,lastSvg='',saveT=0,uid=0,genOpen=false;
var EW=92,EH=62,PAD=16,LM=46,CW=120,GAP=26;
/* Function block catalog for the ladder editor. Mirrors StLibrary.cs.
   pin = the BOOL input that receives the rung's power. out = the BOOL output that becomes the power leaving the block
   (null = power passes straight through). ins = inputs you set in the panel. outs = outputs you can send to variables.
   req = must be filled in. def = starting value. */
function bi(n,def){return {n:n,k:'bool',def:def}}
function ni(n,def,req){return {n:n,k:'num',def:def,req:req}}
function ti(n,def){return {n:n,k:'time',def:def}}
var FB={
 R_TRIG:{d:'One pulse when power turns on',pin:'CLK',out:'Q',ins:[bi('CLK')],outs:[{n:'Q',k:'bool'}]},
 F_TRIG:{d:'One pulse when power turns off',pin:'CLK',out:'Q',ins:[bi('CLK')],outs:[{n:'Q',k:'bool'}]},
 SR:{d:'Latch: power sets it, Reset clears it (set wins)',pin:'S1',out:'Q1',ins:[bi('S1'),bi('R')],outs:[{n:'Q1',k:'bool'}]},
 RS:{d:'Latch: power sets it, Reset clears it (reset wins)',pin:'S',out:'Q1',ins:[bi('S'),bi('R1')],outs:[{n:'Q1',k:'bool'}]},
 TOF:{d:'Off-delay timer: stays on for a time after power drops',pin:'IN',out:'Q',ins:[bi('IN'),ti('PT','T#1s')],outs:[{n:'Q',k:'bool'}]},
 CTU:{d:'Counts pulses. Output on when count reaches PV',pin:'CU',out:'Q',ins:[bi('CU'),bi('R'),ni('PV','10')],outs:[{n:'Q',k:'bool'},{n:'CV',k:'num'}]},
 BLINK:{d:'Flashes its output while power is on',pin:'ENABLE',out:'Q',ins:[bi('ENABLE'),ti('ON_TIME','T#500ms'),ti('OFF_TIME','T#500ms')],outs:[{n:'Q',k:'bool'}]},
 HYST:{d:'Two limits with a gap. On at or below LOW, off at or above HIGH',pin:null,out:'Q',ins:[ni('IN','',true),ni('LOW','20'),ni('HIGH','80'),bi('INVERT','FALSE')],outs:[{n:'Q',k:'bool'}]},
 PID:{d:'PID controller. Power enables it',pin:'ENABLE',out:null,ins:[bi('ENABLE'),ni('PV','',true),ni('SP','',true),ni('KP','1.0'),ni('KI','0.0'),ni('KD','0.0'),ni('OUT_MIN','0.0'),ni('OUT_MAX','100.0')],outs:[{n:'OUT',k:'num'}]},
 SOLAR_TRACK:{d:'Sensor angles to solar panel settings',pin:null,out:null,ins:[ni('SENSOR_H','',true),ni('SENSOR_V','',true),ni('MODE','0')],outs:[{n:'PANEL_H',k:'num'},{n:'PANEL_V',k:'num'}]},
 AIRLOCK:{d:'Full airlock cycle: doors, locks, pumps, pressure, timeout',pin:null,out:null,
  ins:[bi('GO_IN'),bi('GO_OUT'),bi('RESET'),ni('PRESSURE','',true),ni('TARGET_IN','100.0'),ni('TARGET_OUT','0.0'),ni('TOL','2.0'),ti('TIMEOUT','T#60s')],
  outs:[{n:'OPEN_IN',k:'bool'},{n:'OPEN_OUT',k:'bool'},{n:'LOCK_IN',k:'bool'},{n:'LOCK_OUT',k:'bool'},{n:'FILL',k:'bool'},{n:'EVAC',k:'bool'},{n:'BUSY',k:'bool'},{n:'FAULT',k:'bool'},{n:'STATE',k:'num'}]}
};
function fbBase(t){return t.split('_').map(function(w){return w.charAt(0)+w.slice(1).toLowerCase()}).join('')}
function newRung(){return {comment:'',net:[],coils:[]}}
function resetLD(){LD={vars:[],rungs:[newRung()]};SEL=null}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#4ade80'}
function validName(n){return /^[A-Za-z_][A-Za-z0-9_]*$/.test(n)}

function save(){clearTimeout(saveT);saveT=setTimeout(function(){fetch('/api/ladder',{method:'POST',headers:H,body:JSON.stringify(LD)}).catch(function(){})},500)}
var undoS=[],redoS=[],lastSnap='';
function changed(){
  var now=JSON.stringify(LD);
  if(lastSnap&&lastSnap!==now){undoS.push(lastSnap);if(undoS.length>100)undoS.shift();redoS=[]}
  lastSnap=now;save();renderLadder(true);renderVars();showProps();scheduleCheck();
}
function restoreSnap(str){LD=JSON.parse(str);SEL=null;lastSnap=str;save();renderLadder(true);renderVars();showProps();scheduleCheck()}
function doUndo(){if(!undoS.length)return;redoS.push(lastSnap);restoreSnap(undoS.pop())}
function doRedo(){if(!redoS.length)return;undoS.push(lastSnap);restoreSnap(redoS.pop())}
document.addEventListener('keydown',function(e){
  if(tab!=='ladder'||!(e.ctrlKey||e.metaKey))return;var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(e.key==='z'||e.key==='Z'){e.preventDefault();doUndo()}else if(e.key==='y'||e.key==='Y'){e.preventDefault();doRedo()}});

/* ---- live values ---- */
window.onState=function(s){
  var w={};(s.vars||[]).forEach(function(v){
    if(v.t==='TON'){var m=/Q=(\d) ET=(\d+)/.exec(v.v);w[v.n]={q:m?m[1]==='1':false,et:m?parseInt(m[2],10):0,v:0}}
    else w[v.n]={v:parseFloat(v.v)||0}});
  W=w;if(tab==='ladder')renderLadder(false);
};
setInterval(function(){if(tab!=='ladder')return;fetch('/api/state').then(function(r){return r.json()}).then(function(s){window.onState(s)}).catch(function(){})},250);
function truthy(n){var m=/^(\w+)\.(Q|ET)$/i.exec(n||'');if(m){var t=W[m[1]];if(t&&t.q!==undefined)return (m[2].toUpperCase()==='Q'?!!t.q:t.et>0)}var w=W[n];return w?w.v!==0:false}
function num(n){if(n===''||n==null)return 0;if(/^-?\d+(\.\d+)?$/.test(n))return parseFloat(n);var m=/^(\w+)\.ET$/i.exec(n);if(m&&W[m[1]])return W[m[1]].et;var w=W[n];return w?w.v:0}
function evalEl(e){
  if(e.k==='no')return truthy(e.v);if(e.k==='nc')return !truthy(e.v);
  if(e.k==='cmp'){var a=num(e.a),b=num(e.b);switch(e.op){case '>':return a>b;case '<':return a<b;case '>=':return a>=b;case '<=':return a<=b;case '=':return a===b;case '<>':return a!==b}}
  return false;
}

/* ---- layout and drawing ---- */
function sizeSeries(a){if(!a.length)return {w:EW,h:EH};var w=0,h=EH;a.forEach(function(e){var s=sizeEl(e);w+=s.w;if(s.h>h)h=s.h});return {w:w,h:h}}
function sizeEl(e){if(e.k!=='par')return {w:EW,h:EH};var w=0,h=0;e.branches.forEach(function(b){var s=sizeSeries(b);if(s.w>w)w=s.w;h+=s.h});return {w:w+2*PAD,h:h}}
function esc2(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cssv(n,fb){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||fb}
function C(on){return on?css('--ok'):cssv('--off','#5b6b80')}
function L(o,x1,y1,x2,y2,on){o.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+C(on)+'" stroke-width="2.4" stroke-linecap="round"/>')}
function T(o,x,y,t,anchor,col){o.push('<text x="'+x+'" y="'+y+'" text-anchor="'+(anchor||'middle')+'"'+(col?' style="fill:'+col+'"':'')+'>'+esc2(t)+'</text>')}
function reg(item){var id=++uid;MAP[id]=item;return id}
function isSel(obj){return SEL&&SEL.obj===obj}

function plus(o,arr,idx,x,cy,ctx){
  var id=reg({t:'plus',arr:arr,idx:idx,ctx:ctx});
  o.push('<g class="pl" data-id="'+id+'"><circle cx="'+x+'" cy="'+cy+'" r="7" fill="'+css('--panel')+'" stroke="'+css('--acc')+'" stroke-width="1.6"/><path d="M'+(x-3.5)+' '+cy+'H'+(x+3.5)+'M'+x+' '+(cy-3.5)+'V'+(cy+3.5)+'" stroke="'+css('--acc')+'" stroke-width="1.8"/></g>');
}
function drawSeries(o,a,x,y,pin,rung){
  var cy=y+EH/2,cx=x,p=pin,h=EH;
  if(!a.length){L(o,x,cy,x+EW,cy,p);plus(o,a,0,x+EW/2,cy,rung);return {w:EW,h:EH,pout:p}}
  for(var i=0;i<a.length;i++){
    var e=a[i],r;
    plus(o,a,i,cx,cy,rung);
    if(e.k==='par'){r=drawPar(o,e,a,cx,y,p,rung);cx+=r.w}
    else{r=drawEl(o,e,a,cx,cy,p,rung);cx+=EW}
    p=r.pout;if(r.h>h)h=r.h;
  }
  plus(o,a,a.length,cx,cy,rung);
  return {w:cx-x,h:h,pout:p};
}
function drawPar(o,e,arr,x,y,pin,rung){
  var sz=sizeEl(e),inner=sz.w-2*PAD,yy=y,pouts=[],mids=[],cy0=y+EH/2;
  L(o,x,cy0,x+PAD,cy0,pin);
  e.branches.forEach(function(b){
    var r=drawSeries(o,b,x+PAD,yy,pin,rung),cyb=yy+EH/2;
    if(r.w<inner)L(o,x+PAD+r.w,cyb,x+PAD+inner,cyb,r.pout);
    pouts.push(r.pout);mids.push(cyb);yy+=sizeSeries(b).h;
  });
  var pout=pouts.some(function(v){return v});
  var last=mids[mids.length-1];
  L(o,x+PAD,cy0,x+PAD,last,pin);L(o,x+PAD+inner,cy0,x+PAD+inner,last,pout);
  L(o,x+sz.w-PAD,cy0,x+sz.w,cy0,pout);
  return {w:sz.w,h:sz.h,pout:pout};
}
function sh(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'\u2026':s}
function drawEl(o,e,arr,x,cy,pin,rung){
  var mx=x+EW/2,id=reg({t:'el',obj:e,arr:arr,rung:rung}),pout,ac=css('--acc'),tx=css('--text');
  var sel=isSel(e);
  o.push('<g class="el" data-id="'+id+'"><title>'+esc(e.v||'')+'</title>');
  o.push('<rect x="'+(x+4)+'" y="'+(cy-EH/2+4)+'" width="'+(EW-8)+'" height="'+(EH-8)+'" rx="8" fill="'+(sel?'rgba(96,165,250,.14)':'transparent')+'" stroke="'+(sel?ac:'none')+'" stroke-dasharray="4 3"/>');
  var name=e.v||'?',lab;
  if(e.k==='no'||e.k==='nc'){
    var on=evalEl(e);pout=pin&&on;
    L(o,x,cy,mx-9,cy,pin);L(o,mx+9,cy,x+EW,cy,pout);
    o.push('<line x1="'+(mx-9)+'" y1="'+(cy-13)+'" x2="'+(mx-9)+'" y2="'+(cy+13)+'" stroke="'+C(pin)+'" stroke-width="3"/><line x1="'+(mx+9)+'" y1="'+(cy-13)+'" x2="'+(mx+9)+'" y2="'+(cy+13)+'" stroke="'+C(pout)+'" stroke-width="3"/>');
    if(e.k==='nc')o.push('<line x1="'+(mx-14)+'" y1="'+(cy+13)+'" x2="'+(mx+14)+'" y2="'+(cy-13)+'" stroke="'+C(on)+'" stroke-width="2.2"/>');
    T(o,mx,cy-20,sh(name,13),'middle',e.v?null:css('--warn'));
    T(o,mx,cy+27,e.k==='no'?'NO':'NC','middle',css('--dim'));
  }else if(e.k==='cmp'){
    var okc=evalEl(e);pout=pin&&okc;
    L(o,x,cy,mx-32,cy,pin);L(o,mx+32,cy,x+EW,cy,pout);
    o.push('<rect x="'+(mx-32)+'" y="'+(cy-14)+'" width="64" height="28" rx="6" fill="none" stroke="'+C(pin)+'" stroke-width="2.4"/>');
    T(o,mx,cy+4,(e.a||'?')+' '+e.op+' '+(e.b===''||e.b==null?'?':e.b),'middle');
    T(o,mx,cy+27,'COMPARE','middle',css('--dim'));
  }else if(e.k==='fb'){
    var B=FB[e.t]||{ins:[],outs:[]},ov=B.out?truthy(e.v+'.'+B.out):null;
    pout=B.out?(B.pin?ov:(pin&&ov)):pin;
    L(o,x,cy,mx-36,cy,pin);L(o,mx+36,cy,x+EW,cy,pout);
